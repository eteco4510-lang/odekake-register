<!-- STEP 1: 利用者情報確認 -->
<section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs space-y-4">
  <div class="flex items-center justify-between border-b border-slate-100 pb-3">
    <div class="flex items-center gap-2">
      <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-600 text-xs font-black text-white flex-shrink-0">1</span>
      <h2 class="text-base font-bold text-slate-900">利用者（ご依頼主）情報</h2>
    </div>
    <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100 whitespace-nowrap flex-shrink-0">必須</span>
  </div>

  <div class="space-y-3.5 text-base">
    <div>
      <label class="block font-bold text-slate-800 mb-1.5 flex items-center justify-between gap-2">
        <span class="truncate">利用者登録番号</span>
        <a href="user-register.html" target="_blank" class="text-xs font-bold text-blue-600 hover:underline whitespace-nowrap flex-shrink-0">番号をお持ちでない方へ</a>
      </label>
      <div class="relative">
        <input
          type="tel"
          id="userRegId"
          placeholder="例: 20101"
          oninput="handleUserNumberInput()"
          required
          class="w-full h-14 rounded-xl border-2 border-slate-200 bg-slate-50 px-4 font-mono font-bold text-slate-900 text-lg outline-none focus:border-blue-600 focus:bg-white box-border"
        />
        <div id="userLoadingSpinner" class="absolute right-3.5 top-1/2 -translate-y-1/2 hidden">
          <i data-lucide="loader-2" class="h-6 w-6 animate-spin text-blue-600"></i>
        </div>
      </div>
      <div id="userResultBadge" class="mt-1.5 text-xs font-bold text-slate-500">登録番号を入力すると自動で氏名が確認されます</div>
    </div>

    <!-- 確認済利用者カード（登録名のみを表示） -->
    <div id="verifiedUserCard" class="rounded-xl border border-emerald-200 bg-emerald-50/60 p-3.5 hidden space-y-1">
      <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-800">
        <i data-lucide="check-circle-2" class="h-4 w-4"></i>
        <span>登録者確認完了</span>
      </div>
      <div id="verifiedUserName" class="text-base font-black text-slate-900">-- 様</div>
    </div>
  </div>
</section>

<script>
  // 登録番号入力時の処理（登録名だけを抽出して表示）
  function handleUserNumberInput() {
    const val = document.getElementById("userRegId").value.trim();
    const card = document.getElementById("verifiedUserCard");
    const nameEl = document.getElementById("verifiedUserName");
    const spinner = document.getElementById("userLoadingSpinner");

    if (val.length < 5) {
      verifiedUserData = null;
      card.classList.add("hidden");
      return;
    }

    if (window._userFetchTimer) clearTimeout(window._userFetchTimer);
    spinner.classList.remove("hidden");

    window._userFetchTimer = setTimeout(async () => {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getUserDetail&userNum=${encodeURIComponent(val)}&_t=${Date.now()}`);
        const data = await res.json();
        spinner.classList.add("hidden");
        if (data.success && data.user) {
          verifiedUserData = data.user;
          // ここで「登録名だけ」を表示するように変更
          nameEl.textContent = `${data.user.name} 様`;
          card.classList.remove("hidden");
        } else {
          verifiedUserData = null;
          card.classList.add("hidden");
        }
      } catch (e) {
        spinner.classList.add("hidden");
        verifiedUserData = null;
        card.classList.add("hidden");
      }
    }, 400);
  }
</script>
