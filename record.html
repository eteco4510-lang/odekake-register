<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 活動記録</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --danger-red: #DC2626;
      --danger-bg: #FEF2F2;
      --warning-amber: #D97706;
      --warning-bg: #FEF3C7;
      --success-green: #15803D;
      --success-bg: #DCFCE7;
      --border-color: rgba(60, 60, 67, 0.12);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 40px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Lucide Icons 共通スタイル */
    .lucide {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.18em;
      stroke-width: 2.2;
      display: inline-block;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.9s linear infinite;
    }

    header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5EA;
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 0.5px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      gap: 6px;
    }
    .form-group .sub-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    .auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--success-bg);
      color: var(--success-green);
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 9999px;
      margin-left: 6px;
      font-weight: 700;
    }
    input[type="text"], input[type="tel"], input[type="number"] {
      width: 100%;
      height: 46px;
      border: 1.5px solid #E5E5EA;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 1rem;
      color: var(--text-main);
      background: #FAFAFA;
      outline: none;
      transition: all 0.2s var(--ease-spring);
    }
    input:focus {
      border-color: var(--primary-blue);
      background: #FFF;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
    }

    /* ★iOS風トグルスイッチ スタイル */
    .toggle-switch-container {
      width: 100%;
      margin-top: 6px;
    }
    .toggle-switch {
      position: relative;
      display: flex;
      background-color: #E2E8F0;
      border-radius: 14px;
      padding: 4px;
      cursor: pointer;
      user-select: none;
      height: 48px;
      border: 1px solid rgba(0,0,0,0.04);
      transition: background-color 0.2s ease;
