<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 運行掲示板</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --system-green: #28CD41;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --border-color: rgba(60, 60, 67, 0.12);
      --danger-red: #FF3B30;
      --warn-amber: #FF9500;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 40px;
      line-height: 1.5;
    }
    .lucide {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.18em;
      stroke-width: 2.2;
      display: inline-block;
      flex-shrink: 0;
    }
    button, a {
      white-space: nowrap !important;
    }
    header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5EA;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .driver-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #E8F2FF;
      color: var(--primary-blue);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .btn-logout {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
      text-decoration: underline;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 0.5px solid var(--border-color);
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    input[type="tel"] {
      width: 100%;
      height: 46px;
      border: 1.5px solid #E5E5EA;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 1.05rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-main);
      background: #FAFAFA;
      outline: none;
    }
    input:focus {
      border-color: var(--primary-blue);
      background: #FFFFFF;
    }
    .btn-action {
      width: 100%;
      height: 48px;
      background: var(--primary-blue);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      color: #FFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(0,122,255,0.25);
    }
    .btn-refresh {
      background: #FFFFFF;
      border: 1px solid #E5E5EA;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-refresh:active {
      background: var(--surface-secondary);
    }
    .status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      margin-bottom: 8px;
    }

    /* 案件カード */
    .quest-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 0.5px solid var(--border-color);
      margin-bottom: 12px;
      position: relative;
    }
    .quest-card.urgent {
      border: 2px solid var(--danger-red);
      background: #FFFBFB;
    }
    .urgent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--danger-red);
      color: #FFF;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .quest-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
    }
    .quest-datetime {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .trip-plan-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-blue);
      background: #EFF6FF;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .quest-route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: var(--surface-secondary);
      border-radius: 8px;
    }
    .quest-details {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* アクションボタングループ（目安ルート ＆ 受託） */
    .quest-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    .btn-route-preview {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 48px;
      padding: 0 14px;
      background: #FFFFFF;
      color: var(--text-main);
      border: 1.5px solid #E5E5EA;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-route-preview:active {
      background: var(--surface-secondary);
      border-color: #D1D1D6;
    }
    .btn-accept {
      flex: 1;
      width: 100%;
      height: 48px;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 0;
      box-shadow: 0 4px 12px rgba(0,122,255,0.25);
      white-space: nowrap;
    }
    .btn-accept:active {
      background: var(--primary-hover);
    }
    .btn-accept:disabled {
      background: #C7C7CC;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 空表示 */
    .empty-box {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* iOS風 カスタム確認ダイアログ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 0.5px solid var(--border-color);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .modal-message {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
      white-space: pre-wrap;
      text-align: left;
      background: var(--surface-secondary);
      padding: 12px;
      border-radius: 12px;
      margin: 12px 0 16px 0;
    }
    .modal-btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-modal-cancel {
      flex: 1;
      height: 44px;
      background: #E5E5EA;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
    }
    .btn-modal-confirm {
      flex: 1;
      height: 44px;
      background: var(--primary-blue);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #FFFFFF;
      cursor: pointer;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.9s linear infinite;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-title">
        <i data-lucide="car"></i>
        <span>運行掲示板</span>
      </div>
      <div id="driverBadgeArea" style="display:none; align-items:center; gap:8px;">
        <div class="driver-badge">
          <i data-lucide="user-check"></i>
          <span id="dispDriverName">ドライバー</span>
        </div>
        <button type="button" class="btn-logout" onclick="logoutDriver()">解除</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="initialLoadingBox" class="empty-box" style="margin-top:20px;">
      <i data-lucide="loader-2" class="animate-spin" style="width:32px; height:32px; color:var(--primary-blue); margin: 0 auto;"></i>
      <p style="margin-top:8px;">掲示板を読み込み中...</p>
    </div>

    <!-- 認証セクション -->
    <div id="authSection" class="card" style="display:none;">
      <h2 style="font-size:1.15rem; font-weight:800; margin-bottom:12px; text-align:center;">ドライバー認証</h2>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:14px; text-align:center;">
        初回のみ認証が必要です。次回から自動ログインします。
      </p>
      <div class="form-group">
        <label>
          <i data-lucide="user"></i>
          <span>ドライバー登録番号</span>
        </label>
        <input type="tel" id="authDriverId" placeholder="例: 10101" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>
          <i data-lucide="key-round"></i>
          <span>暗証番号（下4桁）</span>
        </label>
        <input type="tel" id="authPhone4" placeholder="例: 1234" maxlength="4" inputmode="numeric">
      </div>
      <button type="button" class="btn-action" id="btnAuth" onclick="executeAuth()">
        <i data-lucide="key"></i>
        <span>認証する</span>
      </button>
    </div>

    <!-- 掲示板セクション -->
    <div id="boardSection" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button type="button" class="btn-refresh" id="btnRefresh" onclick="fetchBoardQuests(true)">
          <i data-lucide="refresh-cw"></i>
          <span>最新の案件に更新</span>
        </button>
        <div id="syncStatusBar" class="status-bar"></div>
      </div>
      <div id="questListArea"></div>
    </div>
  </div>

  <!-- 確認・通知モーダル -->
  <div id="customDialogOverlay" class="modal-overlay" style="display:none;" onclick="handleDialogOverlayClick(event)">
    <div class="modal-card">
      <div id="customDialogIconArea" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
      <h3 id="customDialogTitle" class="modal-title">通知</h3>
      <div id="customDialogMessage" class="modal-message"></div>
      <div class="modal-btn-row">
        <button type="button" class="btn-modal-cancel" id="btnDialogCancel" onclick="closeCustomDialog(false)">キャンセル</button>
        <button type="button" class="btn-modal-confirm" id="btnDialogOk" onclick="closeCustomDialog(true)">OK</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function createTripBadgeHtml(tripPlan) {
      const text = String(tripPlan || '往復').trim();
      if (text.includes('片道')) {
        return `<div class="trip-plan-badge"><i data-lucide="arrow-right"></i><span>片道</span></div>`;
      }
      return `<div class="trip-plan-badge"><i data-lucide="repeat"></i><span>${escapeHtml(text)}</span></div>`;
    }

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    const LOCAL_CACHE_KEY = 'odekake_board_quests_cache_v3';

    let currentDriver = null;
    let currentQuests = [];
    let isProcessingAccept = false;
    let lineUserId = '';

    function refreshLucide() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    let customDialogResolve = null;
    function showCustomAlert(message, title = 'お知らせ', iconName = 'info', iconColor = 'var(--primary-blue)') {
      return new Promise((resolve) => {
        document.getElementById('customDialogIconArea').innerHTML = `<i data-lucide="${iconName}" style="width:42px; height:42px; color:${iconColor};"></i>`;
        document.getElementById('customDialogTitle').textContent = title;
        document.getElementById('customDialogMessage').textContent = message;
        document.getElementById('btnDialogCancel').style.display = 'none';
        document.getElementById('btnDialogOk').textContent = '閉じる';
        customDialogResolve = resolve;
        document.getElementById('customDialogOverlay').style.display = 'flex';
        refreshLucide();
      });
    }

    function showCustomConfirm(message, title = 'ご確認', iconName = 'help-circle', iconColor = 'var(--primary-blue)') {
      return new Promise((resolve) => {
        document.getElementById('customDialogIconArea').innerHTML = `<i data-lucide="${iconName}" style="width:42px; height:42px; color:${iconColor};"></i>`;
        document.getElementById('customDialogTitle').textContent = title;
        document.getElementById('customDialogMessage').textContent = message;
        document.getElementById('btnDialogCancel').style.display = 'block';
        document.getElementById('btnDialogCancel').textContent = 'やめる';
        document.getElementById('btnDialogOk').textContent = '受託する';
        customDialogResolve = resolve;
        document.getElementById('customDialogOverlay').style.display = 'flex';
        refreshLucide();
      });
    }

    function closeCustomDialog(result) {
      document.getElementById('customDialogOverlay').style.display = 'none';
      if (customDialogResolve) {
        const cb = customDialogResolve;
        customDialogResolve = null;
        cb(result);
      }
    }

    function handleDialogOverlayClick(e) {
      if (e.target.id === 'customDialogOverlay') closeCustomDialog(false);
    }

    function hideInitialLoading() {
      const loadBox = document.getElementById('initialLoadingBox');
      if (loadBox) loadBox.style.display = 'none';
    }

    function showAuthView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('boardSection').style.display = 'none';
      document.getElementById('driverBadgeArea').style.display = 'none';
      refreshLucide();
    }

    function showBoardView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('boardSection').style.display = 'block';
      document.getElementById('driverBadgeArea').style.display = 'flex';
      document.getElementById('dispDriverName').textContent = `${currentDriver.name || 'ボランティア'} (ID:${currentDriver.id})`;

      const localCached = localStorage.getItem(LOCAL_CACHE_KEY);
      if (localCached) {
        try {
          const cachedQuests = JSON.parse(localCached);
          if (cachedQuests && cachedQuests.length > 0) {
            currentQuests = cachedQuests;
            renderQuests(cachedQuests);
          }
        } catch (e) {}
      }

      fetchBoardQuests(false);
      refreshLucide();
    }

    async function logoutDriver() {
      const ok = await showCustomConfirm(
        '登録情報の連携を解除しますか？\n（再度ログインする際は登録番号と暗証番号が必要になります）',
        '連携解除の確認',
        'alert-triangle',
        'var(--danger-red)'
      );
      if (ok) {
        localStorage.removeItem('odekake_driver');
        localStorage.removeItem(LOCAL_CACHE_KEY);
        currentDriver = null;
        showAuthView();
      }
    }

    async function executeAuth(targetId = null, targetPhone4 = null) {
      const dId = targetId || document.getElementById('authDriverId').value.trim();
      const p4 = targetPhone4 || document.getElementById('authPhone4').value.trim();

      if (!dId || !p4) {
        await showCustomAlert('ドライバー登録番号と電話番号の下4桁を入力してください。', '入力確認', 'alert-circle', 'var(--warn-amber)');
        return false;
      }

      const btn = document.getElementById('btnAuth');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i><span>認証中...</span>';
        refreshLucide();
      }

      try {
        const payload = {
          action: 'authDriver',
          driverId: dId,
          phone4: p4,
          lineUserId: lineUserId
        };

        const res = await (await fetch(`${GAS_API_URL}?action=authDriver`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        })).json();

        if (res.success && res.driver) {
          currentDriver = res.driver;
          localStorage.setItem('odekake_driver', JSON.stringify(res.driver));
          showBoardView();
          if (targetId) {
            await showCustomAlert(`ようこそ、${res.driver.name} 様！\n掲示板への自動ログインが完了しました。`, '認証完了', 'check-circle-2', 'var(--system-green)');
          }
          return true;
        } else {
          await showCustomAlert(res.message || '登録情報と一致しませんでした。', '認証エラー', 'alert-circle', 'var(--danger-red)');
          showAuthView();
          return false;
        }
      } catch (e) {
        await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', 'alert-circle', 'var(--danger-red)');
        showAuthView();
        return false;
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="key"></i><span>認証する</span>';
          refreshLucide();
        }
      }
    }

    async function fetchBoardQuests(isManualRefresh = false) {
      const listArea = document.getElementById('questListArea');
      const statusBar = document.getElementById('syncStatusBar');
      const btn = document.getElementById('btnRefresh');

      const getIcon = () => btn ? btn.querySelector('svg, i') : null;

      if (isManualRefresh && btn) {
        btn.disabled = true;
        const icon = getIcon();
        if (icon) icon.classList.add('animate-spin');
        if (statusBar) statusBar.textContent = '最新情報を取得中...';
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);

      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const res = await fetch(`${GAS_API_URL}?action=getBoardQuests${cacheBuster}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await res.json();
        const quests = (data && data.success) ? (data.quests || []) : [];

        currentQuests = quests;
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(quests));
        renderQuests(quests);

        if (statusBar) {
          statusBar.textContent = `最終更新: ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (e) {
        clearTimeout(timeoutId);
        console.warn('掲示板更新エラー:', e);
        if (statusBar) {
          statusBar.textContent = (e.name === 'AbortError') ? '通信タイムアウト' : '更新エラー';
        }
      } finally {
        const currentIcon = getIcon();
        if (currentIcon) currentIcon.classList.remove('animate-spin');
        if (btn) btn.disabled = false;
        hideInitialLoading();
        refreshLucide();
      }
    }

    function renderQuests(quests) {
      const listArea = document.getElementById('questListArea');
      if (!quests || quests.length === 0) {
        listArea.innerHTML = `<div class="empty-box"><i data-lucide="check-circle" style="width:32px; height:32px; color:var(--system-green); margin: 0 auto;"></i><p style="margin-top:8px;">現在募集中の送迎案件はありません</p></div>`;
        refreshLucide();
        return;
      }

      listArea.innerHTML = '';
      quests.forEach(q => {
        const urgentClass = q.isUrgent ? 'urgent' : '';

        // ★Googleマップで検索する「目安ルート」リンクURLの生成
        let navUrl = '';
        if (q.pickup && q.dropoff) {
          navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(q.pickup)}&destination=${encodeURIComponent(q.dropoff)}&travelmode=driving`;
        } else if (q.dropoff) {
          navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.dropoff)}`;
        } else if (q.pickup) {
          navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.pickup)}`;
        }

        const card = document.createElement('div');
        card.className = `quest-card ${urgentClass}`;
        card.innerHTML = `
          ${q.isUrgent ? `<div class="urgent-badge"><i data-lucide="alert-triangle"></i><span>【至急】直前募集中</span></div>` : ''}
          <div class="quest-header">
            <span class="quest-id">#${escapeHtml(q.id)}</span>
            <span class="quest-datetime">${escapeHtml(q.targetDate || '')} ${escapeHtml(q.targetTime || '')} 集合</span>
          </div>
          ${createTripBadgeHtml(q.tripPlan)}
          <div class="quest-route">
            <span style="flex:1; word-break:break-all;">${escapeHtml(q.pickup)}</span>
            <i data-lucide="arrow-right" style="color:var(--text-muted); flex-shrink:0;"></i>
            <span style="flex:1; word-break:break-all; color:var(--primary-blue);">${escapeHtml(q.dropoff)}</span>
          </div>
          <div class="quest-details">
            <div><strong>乗車人数:</strong> ${escapeHtml(q.passengers || '1名')} / ${escapeHtml(q.userNameMasked || '登録利用者 様')}</div>
            ${q.note ? `<div style="margin-top:2px;"><strong>備考:</strong> ${escapeHtml(q.note)}</div>` : ''}
          </div>

          <!-- アクションボタン群（目安ルート ＆ 受託ボタン） -->
          <div class="quest-actions">
            ${navUrl ? `
              <a
                href="${escapeHtml(navUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-route-preview"
                title="Googleマップで推奨・目安ルートを開く"
              >
                <i data-lucide="navigation"></i>
                <span>目安ルート</span>
              </a>
            ` : ''}
            <button type="button" class="btn-accept" onclick="confirmAcceptQuest('${escapeHtml(q.id)}')">
              <i data-lucide="check"></i>
              <span>受託する</span>
            </button>
          </div>
        `;
        listArea.appendChild(card);
      });
      refreshLucide();
    }

    async function confirmAcceptQuest(qid) {
      if (isProcessingAccept) return;
      if (!currentDriver || !currentDriver.id) {
        showAuthView();
        return;
      }

      const quest = currentQuests.find(q => String(q.id) === String(qid));
      const qText = quest ? `【案件 #${qid}】\n日時: ${quest.targetDate} ${quest.targetTime} 集合\n行先: ${quest.dropoff}\n利用者: ${quest.userNameMasked}` : `案件 #${qid}`;

      const ok = await showCustomConfirm(
        `${qText}\n\nこの案件を受託しますか？\n受託すると公式LINEへ運行案内が届きます。`,
        '受託の確認',
        'car',
        'var(--system-green)'
      );
      if (!ok) return;

      isProcessingAccept = true;

      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const url = `${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(qid)}&driverId=${encodeURIComponent(currentDriver.id)}${cacheBuster}`;
        const res = await (await fetch(url)).json();

        if (res.success) {
          await showCustomAlert(`案件 [#${qid}] の受託が完了しました！\n\n公式LINEへ集合時間や活動記録のリンクをお送りしましたのでご確認ください。安全運転でお願いいたします。`, '受託完了', 'badge-check', 'var(--system-green)');
          fetchBoardQuests(true);
        } else {
          await showCustomAlert(res.message || '受託できませんでした。すでに受託されたか、募集が締め切られています。', '受託不可', 'alert-circle', 'var(--danger-red)');
          fetchBoardQuests(true);
        }
      } catch (e) {
        await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', 'alert-circle', 'var(--danger-red)');
      } finally {
        isProcessingAccept = false;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshLucide();

      const searchParams = new URLSearchParams(window.location.search);
      const urlDriverId = searchParams.get('authDriverId');
      const urlPhone4 = searchParams.get('phone4');

      if (urlDriverId && urlPhone4) {
        executeAuth(urlDriverId.trim(), urlPhone4.trim());
        return;
      }

      const saved = localStorage.getItem('odekake_driver');
      if (saved) {
        try {
          currentDriver = JSON.parse(saved);
          if (currentDriver && currentDriver.id) {
            showBoardView();
            return;
          }
        } catch (e) {}
      }

      showAuthView();
    });
  </script>
</body>
</html>
