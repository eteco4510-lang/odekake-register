<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>運行掲示板 | おでかけサポート</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      -webkit-tap-highlight-color: transparent;
    }
    .lucide { stroke-width: 2.2; }
    *, ::before, ::after { box-sizing: border-box !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased pb-28 text-base">

  <!-- 操作ロック・ローディング用オーバーレイ -->
  <div id="blockingOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs hidden">
    <div class="w-full max-w-xs rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center">
      <i data-lucide="loader-2" class="h-10 w-10 animate-spin text-blue-600 mx-auto"></i>
      <div id="blockingTitle" class="mt-3 text-base font-bold text-slate-900">処理中...</div>
      <div id="blockingDesc" class="mt-1 text-sm text-slate-500">しばらくお待ちください</div>
    </div>
  </div>

  <!-- iOS風カスタムアラート/確認ダイアログ -->
  <div id="customDialog" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-xs hidden">
    <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center">
      <div id="dialogIconArea" class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-blue-600">
        <i data-lucide="info" class="h-6 w-6"></i>
      </div>
      <h3 id="dialogTitle" class="text-lg font-black text-slate-900">確認</h3>
      <p id="dialogMessage" class="mt-2 text-sm text-slate-600 leading-relaxed">メッセージ</p>
      <div id="dialogButtons" class="mt-5 flex items-center justify-center gap-2">
        <button type="button" id="dialogBtnOk" class="w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white shadow-xs hover:bg-blue-700">OK</button>
      </div>
    </div>
  </div>

  <!-- 初期ローディング画面 -->
  <div id="initialLoadingBox" class="fixed inset-0 z-45 flex flex-col items-center justify-center bg-white">
    <i data-lucide="loader-2" class="h-10 w-10 animate-spin text-blue-600 mb-3"></i>
    <span class="text-base font-bold text-slate-700">おでかけサポート 運行掲示板を読み込んでいます...</span>
  </div>

  <!-- 1. ドライバー認証画面（未認証時） -->
  <div id="authSection" class="mx-auto max-w-md px-4 pt-12 sm:px-6 hidden">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-xl space-y-5">
      <div class="text-center space-y-1.5">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-md">
          <i data-lucide="shield-check" class="h-7 w-7"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">ドライバー認証</h2>
        <p class="text-sm text-slate-500">初回のみ認証が必要です。次回から自動ログインします。</p>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label class="block font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            <i data-lucide="user" class="h-4 w-4 text-slate-400"></i>
            <span>ドライバー登録番号</span>
          </label>
          <input
            type="tel"
            id="authDriverId"
            placeholder="例: 10101"
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-slate-50 px-4 font-mono font-bold text-slate-900 text-base outline-none focus:border-blue-600 focus:bg-white"
          />
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            <i data-lucide="key-round" class="h-4 w-4 text-slate-400"></i>
            <span>暗証番号（ご登録電話番号の下4桁）</span>
          </label>
          <input
            type="tel"
            id="authPhone4"
            maxlength="4"
            placeholder="例: 1234"
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-slate-50 px-4 font-mono font-bold text-slate-900 text-base outline-none focus:border-blue-600 focus:bg-white"
          />
        </div>
      </div>

      <button
        type="button"
        id="btnAuth"
        class="inline-flex w-full h-13 items-center justify-center gap-2 rounded-xl bg-blue-600 text-base font-black text-white shadow-md hover:bg-blue-700 active:scale-98 transition"
        onclick="executeAuth()"
      >
        <i data-lucide="key" class="h-5 w-5"></i>
        <span>認証する</span>
      </button>
    </div>
  </div>

  <!-- 2. 運行掲示板メイン画面（認証後） -->
  <div id="boardSection" style="display:none;">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md">
      <div class="mx-auto flex max-w-xl items-center justify-between px-4 py-3 sm:px-6">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-white flex-shrink-0">
            <i data-lucide="car" class="h-5 w-5"></i>
          </div>
          <h1 class="text-lg font-black tracking-tight text-slate-900 whitespace-nowrap">運行掲示板</h1>
        </div>
        
        <div class="flex items-center gap-2 flex-shrink-0">
          <div class="flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-1.5 text-xs font-bold text-slate-800 border border-slate-200 whitespace-nowrap">
            <i data-lucide="user-check" class="h-4 w-4 text-blue-600 flex-shrink-0"></i>
            <span id="driverBadgeText">-- (ID:----)</span>
          </div>
          <button
            type="button"
            onclick="logoutDriver()"
            class="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 whitespace-nowrap"
            title="ログアウト"
          >
            解除
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-xl px-4 pt-4 sm:px-6 space-y-4">

      <!-- 受託中案件アラートバナー -->
      <div id="activeQuestBanner" class="hidden rounded-2xl border border-emerald-300 bg-emerald-50 p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-emerald-900 font-black text-sm sm:text-base">
            <i data-lucide="bell-ring" class="h-5 w-5 text-emerald-600 animate-bounce flex-shrink-0"></i>
            <span>受託中の送迎案件があります</span>
          </div>
          <span id="bannerQid" class="rounded-full bg-emerald-200 px-3 py-0.5 text-xs font-mono font-bold text-emerald-900">#----</span>
        </div>
        <div class="rounded-xl bg-white p-3.5 text-xs sm:text-sm space-y-2 border border-emerald-200 text-slate-700">
          <div class="flex justify-between">
            <span class="text-slate-400 font-medium">集合日時:</span>
            <strong id="bannerDate" class="text-slate-900 font-bold">----</strong>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400 font-medium">出発 ➔ 行先:</span>
            <strong id="bannerRoute" class="text-slate-900 font-bold truncate max-w-[220px]">----</strong>
          </div>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <a
            id="btnGoRecord"
            href="#"
            class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 py-3 text-xs sm:text-sm font-bold text-white shadow-sm hover:bg-emerald-700 active:scale-95"
          >
            <i data-lucide="file-text" class="h-4 w-4"></i>
            <span>活動記録を入力する</span>
          </a>
          <button
            type="button"
            id="btnDeclineQuest"
            class="inline-flex items-center justify-center gap-1 rounded-xl border border-red-200 bg-white px-4 py-3 text-xs sm:text-sm font-bold text-red-600 hover:bg-red-50"
            onclick="confirmDeclineQuest()"
          >
            辞退
          </button>
        </div>
      </div>

      <!-- 更新コントロールバー -->
      <div class="flex items-center justify-between bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs text-xs sm:text-sm">
        <button
          type="button"
          id="btnRefresh"
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 font-bold text-slate-700 hover:bg-slate-100 active:scale-95 transition"
          onclick="fetchBoardQuests(true)"
        >
          <i data-lucide="refresh-cw" class="h-4 w-4 text-slate-500"></i>
          <span>最新の案件に更新</span>
        </button>
        <span id="syncStatusBar" class="text-xs text-slate-400">最終更新: --:--</span>
      </div>

      <!-- 募集中案件リストコンテナ -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs sm:text-sm font-black tracking-wider text-slate-500 uppercase">募集中の一覧</h2>
          <span id="openCountBadge" class="rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-bold text-blue-800">0件</span>
        </div>

        <div id="questListArea" class="space-y-3.5">
          <!-- 動的カード挿入エリア -->
        </div>

        <!-- 案件ゼロ時のステート -->
        <div id="questEmptyState" class="hidden rounded-2xl border border-slate-200 bg-white p-8 text-center space-y-2">
          <i data-lucide="inbox" class="h-10 w-10 text-slate-300 mx-auto"></i>
          <p class="text-base font-bold text-slate-700">現在募集中の案件はありません</p>
          <p class="text-xs sm:text-sm text-slate-400">新しい依頼が入り次第、ここに表示されます。</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    const BOARD_LIFF_ID = "2011784961-QoryA7zc";

    let currentDriver = null;
    let currentQuests = [];
    let activeQuestData = null;
    let lineUserId = '';

    function refreshLucide() {
      if (window.lucide) lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 住所から冗長な都道府県名・相模原市名を自動カットして見やすくする関数
    function formatLocationText(locStr) {
      if (!locStr) return '未指定';
      const str = String(locStr).trim();
      
      const latLngRegex = /^([0-9]+\.[0-9]+)\s*,\s*([0-9]+\.[0-9]+)$/;
      if (latLngRegex.test(str)) {
        return `指定地点 (${str})`;
      }

      let cleaned = str
        .replace(/^日本?,\s*/, '')
        .replace(/^神奈川県/, '')
        .replace(/^相模原市(緑区|中央区|南区)?/, '');

      return cleaned.trim() ? cleaned.trim() : str;
    }

    function showCustomAlert(title, message, isOkOnly = true, callback = null) {
      const dialog = document.getElementById('customDialog');
      document.getElementById('dialogTitle').textContent = title;
      document.getElementById('dialogMessage').textContent = message;
      const btnArea = document.getElementById('dialogButtons');

      if (isOkOnly) {
        btnArea.innerHTML = `<button type="button" id="dialogBtnOk" class="w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white shadow-xs hover:bg-blue-700">OK</button>`;
        document.getElementById('dialogBtnOk').onclick = () => {
          dialog.classList.add('hidden');
          if (callback) callback();
        };
      } else {
        btnArea.innerHTML = `
          <button type="button" id="dialogBtnCancel" class="flex-1 rounded-xl border border-slate-200 bg-white py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">いいえ</button>
          <button type="button" id="dialogBtnConfirm" class="flex-1 rounded-xl bg-red-600 py-3 text-sm font-bold text-white shadow-xs hover:bg-red-700">はい</button>
        `;
        document.getElementById('dialogBtnCancel').onclick = () => dialog.classList.add('hidden');
        document.getElementById('dialogBtnConfirm').onclick = () => {
          dialog.classList.add('hidden');
          if (callback) callback();
        };
      }
      dialog.classList.remove('hidden');
      refreshLucide();
    }

    function showBlockingLoading(title, desc) {
      document.getElementById('blockingTitle').textContent = title;
      document.getElementById('blockingDesc').textContent = desc;
      document.getElementById('blockingOverlay').classList.remove('hidden');
      refreshLucide();
    }

    function hideBlockingLoading() {
      document.getElementById('blockingOverlay').classList.add('hidden');
    }

    function hideInitialLoading() {
      const box = document.getElementById('initialLoadingBox');
      if (box) box.style.display = 'none';
    }

    function showAuthView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('boardSection').style.display = 'none';
      refreshLucide();
    }

    function showBoardView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('boardSection').style.display = 'block';
      if (currentDriver) {
        document.getElementById('driverBadgeText').textContent = `${currentDriver.name} (ID:${currentDriver.id})`;
      }
      fetchBoardQuests();
      refreshLucide();
    }

    async function executeAuth(targetId = null, targetPhone4 = null) {
      const dId = targetId || document.getElementById('authDriverId').value.trim();
      const p4 = targetPhone4 || document.getElementById('authPhone4').value.trim();

      if (!dId || !p4) {
        showCustomAlert('入力エラー', '登録番号と電話番号の下4桁を入力してください。');
        return;
      }

      showBlockingLoading('認証中', '登録情報を確認しています...');

      try {
        const payload = {
          action: 'authDriver',
          driverId: dId,
          phone4: p4,
          lineUserId: lineUserId
        };

        const res = await fetch(`${GAS_API_URL}?action=authDriver`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success && result.driver) {
          currentDriver = result.driver;
          localStorage.setItem('odekake_driver', JSON.stringify(result.driver));
          hideBlockingLoading();
          showBoardView();
          if (targetId) {
            showCustomAlert('認証完了', `ようこそ、${result.driver.name} 様！\n自動ログインしました。`);
          }
        } else {
          hideBlockingLoading();
          showCustomAlert('認証エラー', result.message || '登録情報と一致しませんでした。');
        }
      } catch (err) {
        hideBlockingLoading();
        showCustomAlert('通信エラー', 'サーバーとの通信に失敗しました: ' + err.message);
      }
    }

    function logoutDriver() {
      showCustomAlert('ログアウト確認', 'この端末のドライバー認証を解除しますか？', false, () => {
        localStorage.removeItem('odekake_driver');
        currentDriver = null;
        showAuthView();
      });
    }

    async function fetchBoardQuests(isManualRefresh = false) {
      if (!currentDriver) return;
      const statusBar = document.getElementById('syncStatusBar');
      if (statusBar && isManualRefresh) statusBar.textContent = '最新情報を取得中...';

      try {
        const res = await fetch(`${GAS_API_URL}?action=getOpenQuests&_t=${Date.now()}`);
        const data = await res.json();
        currentQuests = (data && data.success) ? (data.quests || []) : [];
        renderQuests(currentQuests);

        await checkActiveQuestForDriver();

        if (statusBar) {
          statusBar.textContent = `最終更新: ${new Date().toLocaleTimeString('JP-ja', { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (e) {
        if (statusBar) statusBar.textContent = '更新エラー';
      }
    }

    async function checkActiveQuestForDriver() {
      if (!currentDriver) return;
      try {
        const res = await fetch(`${GAS_API_URL}?action=getActiveQuestForDriver&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
        const data = await res.json();
        const banner = document.getElementById('activeQuestBanner');

        if (data.success && data.quest) {
          activeQuestData = data.quest;
          document.getElementById('bannerQid').textContent = `#${activeQuestData.id}`;
          document.getElementById('bannerDate').textContent = activeQuestData.formattedDate || '日時指定';
          document.getElementById('bannerRoute').textContent = `${formatLocationText(activeQuestData.pickup)} ➔ ${formatLocationText(activeQuestData.dropoff)}`;
          document.getElementById('btnGoRecord').href = `https://liff.line.me/2011743949-unqD1uQo?qid=${activeQuestData.id}`;
          banner.classList.remove('hidden');
        } else {
          activeQuestData = null;
          banner.classList.add('hidden');
        }
      } catch (e) {}
    }

    function renderQuests(quests) {
      const area = document.getElementById('questListArea');
      const emptyState = document.getElementById('questEmptyState');
      const badge = document.getElementById('openCountBadge');

      badge.textContent = `${quests.length}件`;
      area.innerHTML = '';

      if (quests.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      quests.forEach(q => {
        const card = document.createElement('div');
        card.className = "rounded-2xl border border-slate-200 bg-white p-5 shadow-xs space-y-3.5 transition hover:shadow-md";

        const cleanPickup = formatLocationText(q.pickup);
        const cleanDropoff = formatLocationText(q.dropoff);

        let navUrl = '';
        if (q.pickup && q.dropoff && q.pickup !== '未指定' && q.dropoff !== '未指定') {
          navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(q.pickup)}&destination=${encodeURIComponent(q.dropoff)}&travelmode=driving`;
        } else if (q.dropoff && q.dropoff !== '未指定') {
          navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.dropoff)}`;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-mono text-sm font-bold text-slate-500">#${escapeHtml(q.id)}</span>
            <span class="rounded-full bg-blue-50 px-3 py-1 text-xs sm:text-sm font-bold text-blue-700 border border-blue-100">${escapeHtml(q.dateText)}</span>
          </div>

          <div class="flex items-center gap-2.5 text-base sm:text-lg font-bold text-slate-900 truncate">
            <span class="text-slate-800 truncate">${escapeHtml(cleanPickup)}</span>
            <i data-lucide="arrow-right" class="h-5 w-5 flex-shrink-0 text-slate-400"></i>
            <span class="text-slate-800 truncate">${escapeHtml(cleanDropoff)}</span>
          </div>

          <div class="rounded-xl bg-slate-50 p-3.5 text-xs sm:text-sm space-y-1.5 border border-slate-100 text-slate-700">
            <div class="flex justify-between">
              <span>乗車人数: <strong class="text-slate-900">${escapeHtml(q.passengers)}</strong></span>
              <span>利用区分: <strong class="text-slate-900">${escapeHtml(q.tripPlan)}</strong></span>
            </div>
            <div>ご依頼主: <strong class="text-slate-900">${escapeHtml(q.userNameMasked)}</strong></div>
            ${q.note ? `<div>備考: ${escapeHtml(q.note)}</div>` : ''}
          </div>

          <div class="flex items-center gap-2 pt-1.5">
            ${navUrl ? `
              <a href="${escapeHtml(navUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-4 py-3 text-xs sm:text-sm font-bold text-slate-700 hover:bg-slate-50 shadow-2xs">
                <i data-lucide="navigation" class="h-4 w-4 text-slate-500"></i>
                <span>目安ルート</span>
              </a>
            ` : ''}
            <button
              type="button"
              class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 py-3 text-xs sm:text-sm font-bold text-white shadow-sm hover:bg-blue-700 active:scale-95 transition"
              onclick="acceptQuest('${escapeHtml(q.id)}')"
            >
              <i data-lucide="check" class="h-4 w-4"></i>
              <span>受託する</span>
            </button>
          </div>
        `;
        area.appendChild(card);
      });
      refreshLucide();
    }

    async function acceptQuest(qid) {
      if (!currentDriver) return;
      showCustomAlert('受託確認', `案件 #${qid} を受託しますか？\n受託すると依頼主とご本人にLINE通知が送信されます。`, false, async () => {
        showBlockingLoading('受託処理中', '案件を受託しています...');
        try {
          const res = await fetch(`${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(qid)}&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
          const data = await res.json();
          hideBlockingLoading();
          if (data.success) {
            showCustomAlert('受託完了', '案件を受託しました！活動記録画面より運行を開始してください。', true, () => {
              fetchBoardQuests(true);
            });
          } else {
            showCustomAlert('受託エラー', data.message || '受託に失敗しました。');
          }
        } catch (e) {
          hideBlockingLoading();
          showCustomAlert('通信エラー', '通信に失敗しました: ' + e.message);
        }
      });
    }

    function confirmDeclineQuest() {
      if (!activeQuestData) return;
      showCustomAlert('受託辞退の確認', `案件 #${activeQuestData.id} の受託を辞退して掲示板に再募集しますか？`, false, async () => {
        showBlockingLoading('辞退処理中', '受託をキャンセルしています...');
        try {
          const res = await fetch(`${GAS_API_URL}?action=cancelQuest&qid=${encodeURIComponent(activeQuestData.id)}&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
          const data = await res.json();
          hideBlockingLoading();
          if (data.success) {
            showCustomAlert('辞退完了', '受託をキャンセルしました。', true, () => {
              fetchBoardQuests(true);
            });
          } else {
            showCustomAlert('エラー', data.message || '辞退処理に失敗しました。');
          }
        } catch (e) {
          hideBlockingLoading();
          showCustomAlert('通信エラー', '通信に失敗しました: ' + e.message);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      refreshLucide();

      try {
        if (window.liff) {
          await liff.init({ liffId: BOARD_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            lineUserId = profile.userId || '';
          }
        }
      } catch (e) {}

      const urlParams = new URLSearchParams(window.location.search);
      const urlDriverId = urlParams.get('authDriverId');
      const urlPhone4 = urlParams.get('phone4');
      if (urlDriverId && urlPhone4) {
        executeAuth(urlDriverId.trim(), urlPhone4.trim());
        return;
      }

      const savedDriver = localStorage.getItem('odekake_driver');
      if (savedDriver) {
        try {
          currentDriver = JSON.parse(savedDriver);
          if (currentDriver && currentDriver.id) {
            showBoardView();
            return;
          }
        } catch (e) {}
      }

      showAuthView();
    });
  </script>
</body>
</html>
