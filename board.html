<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 運行掲示板</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --danger-red: #DC2626;
      --danger-bg: #FEF2F2;
      --warning-amber: #D97706;
      --warning-bg: #FEF3C7;
      --border-color: rgba(60, 60, 67, 0.12);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 40px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .lucide {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.18em;
      stroke-width: 2.2;
      display: inline-block;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.9s linear infinite;
    }

    header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5EA;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .driver-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-secondary);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .btn-logout {
      background: none;
      border: none;
      color: var(--danger-red);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      margin-left: 4px;
      padding: 2px 4px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .sync-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .sync-status-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .btn-manual-sync {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 0.5px solid var(--border-color);
      position: relative;
    }
    .card.urgent {
      border: 2px solid #EF4444;
      background: #FFFDFD;
    }
    .urgent-banner {
      background: #EF4444;
      color: #FFF;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #E5E5EA;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .quest-id {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .quest-datetime {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .route-container {
      background: var(--surface-secondary);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .route-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .route-row:first-child {
      margin-bottom: 10px;
    }
    .route-icon-box {
      background: #E5E5EA;
      color: #3C3C43;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
      margin-bottom: 14px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3C3C43;
    }
    .note-box {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .btn-accept {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      background: var(--primary-blue);
      color: #FFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0,122,255,0.22);
    }
    .btn-accept:active {
      background: var(--primary-hover);
    }
    .empty-box {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    /* 認証カード */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      height: 46px;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: 22px;
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
    }
    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-modal-cancel {
      height: 46px;
      background: var(--surface-secondary);
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }
    .btn-modal-confirm {
      height: 46px;
      background: var(--primary-blue);
      border: none;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #FFF;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-title">
      <i data-lucide="car"></i>
      <span>運行掲示板</span>
    </div>
    <div id="driverBadgeArea" style="display:none;" class="driver-badge">
      <span id="dispDriverName">ドライバー</span>
      <button class="btn-logout" onclick="logoutDriver()">解除</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- 認証セクション -->
  <div id="authSection" class="card" style="display:none;">
    <h2 style="font-size:1.15rem; font-weight:800; margin-bottom:12px; text-align:center;">ドライバー認証</h2>
    <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:16px; text-align:center;">
      登録番号と電話番号下4桁を入力してログインしてください
    </p>
    <div class="form-group">
      <label>ドライバー登録番号</label>
      <input type="tel" id="authDriverId" placeholder="例: 10101" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>登録電話番号（下4桁）</label>
      <input type="tel" id="authPhone4" placeholder="例: 1234" maxlength="4" inputmode="numeric">
    </div>
    <button type="button" class="btn-accept" id="btnAuth" onclick="executeAuth()">
      <i data-lucide="log-in"></i>
      <span>認証する</span>
    </button>
  </div>

  <!-- 掲示板セクション -->
  <div id="boardSection" style="display:none;">
    <div class="sync-bar-container">
      <span class="sync-status-text" id="syncStatusText">最新の案件を表示中</span>
      <button type="button" class="btn-manual-sync" id="btnManualSync" onclick="fetchOpenQuests(true)">
        <i data-lucide="refresh-cw" id="syncIcon" style="width:13px; height:13px;"></i>
        <span>最新の案件に更新</span>
      </button>
    </div>
    <div id="questList"></div>
  </div>
</div>

<!-- 受託確認モーダル -->
<div id="acceptModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:center; margin-bottom:10px;">
      <i data-lucide="check-circle-2" style="width:42px; height:42px; color:var(--primary-blue);"></i>
    </div>
    <h3 class="modal-title">この案件を受託しますか？</h3>
    <div id="modalQuestDetails" style="font-size:0.88rem; background:var(--surface-secondary); padding:12px; border-radius:12px; line-height:1.5;"></div>
    <div class="modal-buttons">
      <button type="button" class="btn-modal-cancel" onclick="closeAcceptModal()">やめる</button>
      <button type="button" class="btn-modal-confirm" id="btnConfirmAccept" onclick="confirmAccept()">受託する</button>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
  const LIFF_ID = "2011784961-LZ6p8VqP";

  let currentDriver = null;
  let lineUserId = '';
  let targetQuestId = null;

  function refreshLucide() {
    if (window.lucide) {
      lucide.createIcons();
    }
  }

  // ★認証実行（lineUserId を一緒に送信して名簿へ自動紐付け！）
  async function executeAuth() {
    const dId = document.getElementById('authDriverId').value.trim();
    const p4 = document.getElementById('authPhone4').value.trim();
    if (!dId || !p4) {
      alert('登録番号と電話番号下4桁を入力してください');
      return;
    }

    const btn = document.getElementById('btnAuth');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i><span>認証中...</span>';
    refreshLucide();

    try {
      // lineUserId があればクエリに付与
      let url = `${GAS_API_URL}?action=authDriver&driverId=${encodeURIComponent(dId)}&phone4=${encodeURIComponent(p4)}`;
      if (lineUserId) {
        url += `&lineUserId=${encodeURIComponent(lineUserId)}`;
      }

      const res = await (await fetch(url)).json();
      if (res.success && res.driver) {
        currentDriver = res.driver;
        localStorage.setItem('odekake_driver', JSON.stringify(res.driver));
        document.getElementById('authSection').style.display = 'none';
        setupBoard();
      } else {
        alert(res.message || '認証に失敗しました');
      }
    } catch (e) {
      alert('通信エラー: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in"></i><span>認証する</span>';
      refreshLucide();
    }
  }

  function setupBoard() {
    document.getElementById('dispDriverName').textContent = `${currentDriver.name} 様`;
    document.getElementById('driverBadgeArea').style.display = 'inline-flex';
    document.getElementById('boardSection').style.display = 'block';
    fetchOpenQuests(false);
  }

  function logoutDriver() {
    if (confirm('登録情報の連携を解除しますか？')) {
      localStorage.removeItem('odekake_driver');
      currentDriver = null;
      document.getElementById('driverBadgeArea').style.display = 'none';
      document.getElementById('boardSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
      refreshLucide();
    }
  }

  async function fetchOpenQuests(isManual = false) {
    const syncText = document.getElementById('syncStatusText');
    const syncIcon = document.getElementById('syncIcon');
    if (syncIcon) syncIcon.classList.add('animate-spin');
    syncText.textContent = '最新情報を取得中...';

    try {
      const res = await (await fetch(`${GAS_API_URL}?action=getOpenQuests`)).json();
      if (res.success) {
        renderQuests(res.quests || []);
        syncText.textContent = '最新の情報に更新済み';
      }
    } catch (e) {
      syncText.textContent = '取得エラー';
    } finally {
      if (syncIcon) syncIcon.classList.remove('animate-spin');
    }
  }

  function renderQuests(quests) {
    const list = document.getElementById('questList');
    if (quests.length === 0) {
      list.innerHTML = '<div class="card empty-box"><i data-lucide="info" style="width:36px; height:36px; margin-bottom:8px;"></i><p>現在募集中の運行案件はありません。</p></div>';
      refreshLucide();
      return;
    }

    list.innerHTML = quests.map(q => `
      <div class="card ${q.isUrgent ? 'urgent' : ''}">
        ${q.isUrgent ? '<div class="urgent-banner"><i data-lucide="alert-triangle"></i><span>【至急】運行日が迫っています（直前募集中）</span></div>' : ''}
        <div class="quest-header">
          <span class="quest-id">案件 #${q.id}</span>
          <div class="quest-datetime">
            <i data-lucide="calendar"></i>
            <span>${q.dateText}</span>
          </div>
        </div>
        <div class="route-container">
          <div class="route-row">
            <span class="route-icon-box">出発</span>
            <span>${q.pickup}</span>
          </div>
          <div class="route-row">
            <span class="route-icon-box">行先</span>
            <span style="color:var(--primary-blue);">${q.dropoff}</span>
          </div>
        </div>
        <div class="meta-list">
          <div class="meta-item">
            <i data-lucide="repeat"></i>
            <span>区分: <strong>${q.tripPlan}</strong></span>
          </div>
          <div class="meta-item">
            <i data-lucide="users"></i>
            <span>人数: ${q.passengers} / 利用者: ${q.userNameMasked}</span>
          </div>
        </div>
        ${q.note ? `<div class="note-box"><i data-lucide="alert-circle" style="flex-shrink:0;"></i><span>${q.note}</span></div>` : ''}
        <button type="button" class="btn-accept" onclick="openAcceptModal('${q.id}', '${q.dateText}', '${q.pickup}', '${q.dropoff}')">
          <i data-lucide="check"></i>
          <span>この案件を受託する</span>
        </button>
      </div>
    `).join('');
    refreshLucide();
  }

  function openAcceptModal(qid, dt, pickup, dropoff) {
    targetQuestId = qid;
    document.getElementById('modalQuestDetails').innerHTML = `
      <strong>案件番号:</strong> #${qid}<br>
      <strong>集合日時:</strong> ${dt}<br>
      <strong>出発地:</strong> ${pickup}<br>
      <strong>行先:</strong> ${dropoff}<br><br>
      ※受託すると公式LINEへ運行案内が届きます。
    `;
    document.getElementById('acceptModal').style.display = 'flex';
    refreshLucide();
  }

  function closeAcceptModal() {
    document.getElementById('acceptModal').style.display = 'none';
    targetQuestId = null;
  }

  async function confirmAccept() {
    if (!targetQuestId || !currentDriver) return;
    const btn = document.getElementById('btnConfirmAccept');
    btn.disabled = true;
    btn.textContent = '受託処理中...';

    try {
      const url = `${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(targetQuestId)}&driverId=${encodeURIComponent(currentDriver.id)}`;
      const res = await (await fetch(url)).json();
      if (res.success) {
        closeAcceptModal();
        alert(`案件 [#${targetQuestId}] の受託が完了しました！\n公式LINEへ集合時間や活動記録のリンクをお送りしましたのでご確認ください。安全運転でお願いいたします。`);
        fetchOpenQuests(true);
      } else {
        alert('受託できませんでした: ' + (res.message || 'すでに受託されたか募集が締め切られています'));
        closeAcceptModal();
        fetchOpenQuests(true);
      }
    } catch (e) {
      alert('通信エラー: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '受託する';
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    refreshLucide();

    try {
      if (window.liff) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
        }
      }
    } catch (e) {
      console.warn('LIFFスキップ:', e);
    }

    const saved = localStorage.getItem('odekake_driver');
    if (saved) {
      try {
        currentDriver = JSON.parse(saved);
        if (currentDriver && currentDriver.id) {
          setupBoard();
          return;
        }
      } catch (e) {}
    }

    document.getElementById('authSection').style.display = 'block';
    refreshLucide();
  });
</script>
</body>
</html>
