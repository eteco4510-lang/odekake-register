<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>運行掲示板 | おでかけサポート</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      -webkit-tap-highlight-color: transparent;
    }
    .lucide { stroke-width: 2.2; }
    *, ::before, ::after { box-sizing: border-box !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased pb-32 text-lg overflow-x-hidden">

  <!-- 操作ロック・ローディング用オーバーレイ -->
  <div id="blockingOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs hidden">
    <div class="w-full max-w-xs rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center">
      <i data-lucide="loader-2" class="h-12 w-12 animate-spin text-blue-600 mx-auto"></i>
      <div id="blockingTitle" class="mt-3 text-lg font-bold text-slate-900">処理中...</div>
      <div id="blockingDesc" class="mt-1 text-base text-slate-500">しばらくお待ちください</div>
    </div>
  </div>

  <!-- iOS風カスタムアラート/確認ダイアログ -->
  <div id="customDialog" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-xs hidden">
    <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center space-y-3">
      <div id="dialogIconArea" class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-blue-50 text-blue-600">
        <i data-lucide="info" class="h-7 w-7"></i>
      </div>
      <h3 id="dialogTitle" class="text-xl font-black text-slate-900">確認</h3>
      <p id="dialogMessage" class="text-base text-slate-700 leading-relaxed">メッセージ</p>
      <div id="dialogButtons" class="pt-2 flex items-center justify-center gap-2">
        <button type="button" id="dialogBtnOk" class="w-full rounded-2xl bg-blue-600 py-3.5 text-base font-bold text-white shadow-xs hover:bg-blue-700">OK</button>
      </div>
    </div>
  </div>

  <!-- 初期ローディング画面 -->
  <div id="initialLoadingBox" class="fixed inset-0 z-45 flex flex-col items-center justify-center bg-white p-6 text-center">
    <i data-lucide="loader-2" class="h-12 w-12 animate-spin text-blue-600 mb-3"></i>
    <span class="text-lg font-bold text-slate-700">おでかけサポート 運行掲示板を読み込んでいます...</span>
  </div>

  <!-- 1. ドライバー認証画面（未認証時） -->
  <div id="authSection" class="mx-auto max-w-md px-4 pt-12 sm:px-6 hidden">
    <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8 shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-md">
          <i data-lucide="shield-check" class="h-8 w-8"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900">ドライバー認証</h2>
        <p class="text-base text-slate-600">初回のみ認証が必要です。次回から自動ログインします。</p>
      </div>

      <div class="space-y-4 text-base">
        <div>
          <label class="block font-bold text-slate-800 mb-2 flex items-center gap-2">
            <i data-lucide="user" class="h-5 w-5 text-slate-400"></i>
            <span>ドライバー登録番号</span>
          </label>
          <input
            type="tel"
            id="authDriverId"
            placeholder="例: 10101"
            class="w-full h-14 rounded-2xl border-2 border-slate-200 bg-slate-50 px-4 font-mono font-bold text-slate-900 text-xl outline-none focus:border-blue-600 focus:bg-white"
          />
        </div>
        <div>
          <label class="block font-bold text-slate-800 mb-2 flex items-center gap-2">
            <i data-lucide="key-round" class="h-5 w-5 text-slate-400"></i>
            <span>暗証番号（登録電話番号の下4桁）</span>
          </label>
          <input
            type="tel"
            id="authPhone4"
            maxlength="4"
            placeholder="例: 1234"
            class="w-full h-14 rounded-2xl border-2 border-slate-200 bg-slate-50 px-4 font-mono font-bold text-slate-900 text-xl outline-none focus:border-blue-600 focus:bg-white"
          />
        </div>
      </div>

      <button
        type="button"
        id="btnAuth"
        class="inline-flex w-full h-16 items-center justify-center gap-2.5 rounded-2xl bg-blue-600 text-lg font-black text-white shadow-md hover:bg-blue-700 active:scale-98 transition"
        onclick="executeAuth()"
      >
        <i data-lucide="key" class="h-6 w-6"></i>
        <span>認証する</span>
      </button>
    </div>
  </div>

  <!-- 2. 運行掲示板メイン画面（認証後） -->
  <div id="boardSection" style="display:none;">
    <!-- スティッキーヘッダー（タイトルとユーザー名の重なりを解消する縦並びスタック対応版） -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md">
      <div class="mx-auto flex max-w-xl flex-col sm:flex-row sm:items-center sm:justify-between px-4 py-3 gap-2.5 sm:gap-4">
        
        <!-- 上段（スマホ） / 左側（PC）：アイコン ＆ タイトル -->
        <div class="flex items-center justify-between w-full sm:w-auto min-w-0">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white shadow-xs flex-shrink-0">
              <i data-lucide="car" class="h-6 w-6"></i>
            </div>
            <h1 class="text-xl font-black tracking-tight text-slate-900 whitespace-nowrap">運行掲示板</h1>
          </div>
        </div>
        
        <!-- 下段（スマホ） / 右側（PC）：ドライバー情報 ＆ 解除ボタン -->
        <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto pt-1 sm:pt-0 border-t sm:border-t-0 border-slate-100">
          <div class="flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2 text-sm font-bold text-slate-900 border border-slate-200 min-w-0 flex-1 sm:flex-initial">
            <i data-lucide="user-check" class="h-5 w-5 text-blue-600 flex-shrink-0"></i>
            <span id="driverBadgeText" class="truncate">-- (ID:----)</span>
          </div>
          <button
            type="button"
            onclick="logoutDriver()"
            class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50 whitespace-nowrap flex-shrink-0"
            title="ログアウト"
          >
            解除
          </button>
        </div>

      </div>
    </header>

    <main class="mx-auto max-w-xl px-4 pt-5 sm:px-6 space-y-6">

      <!-- 受託中案件アラートバナー -->
      <div id="activeQuestBanner" class="hidden rounded-3xl border-2 border-emerald-300 bg-emerald-50 p-6 shadow-sm space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-emerald-900 font-black text-lg">
            <i data-lucide="bell-ring" class="h-6 w-6 text-emerald-600 animate-bounce flex-shrink-0"></i>
            <span>受託中の送迎案件があります</span>
          </div>
          <span id="bannerQid" class="rounded-full bg-emerald-200 px-3.5 py-1 text-base font-mono font-black text-emerald-900">#----</span>
        </div>
        <div class="rounded-2xl bg-white p-4 text-base space-y-2 border border-emerald-200 text-slate-900 font-medium">
          <div class="flex justify-between">
            <span class="text-slate-500 font-bold">集合日時:</span>
            <strong id="bannerDate" class="text-slate-900 font-bold">----</strong>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-500 font-bold">出発 ➔ 行先:</span>
            <strong id="bannerRoute" class="text-slate-900 font-bold truncate max-w-[240px]">----</strong>
          </div>
        </div>

        <!-- カレンダー追加ボタン -->
        <div>
          <button
            type="button"
            onclick="addToDeviceCalendar(activeQuestData)"
            class="w-full inline-flex items-center justify-center gap-2 rounded-2xl border-2 border-emerald-300 bg-white py-3 text-base font-bold text-emerald-800 hover:bg-emerald-50 active:scale-95 transition shadow-2xs"
          >
            <i data-lucide="calendar-plus" class="h-5 w-5 text-emerald-600 flex-shrink-0"></i>
            <span>スマホのカレンダーに予定を追加する</span>
          </button>
        </div>

        <div class="flex items-center gap-3 pt-1">
          <a
            id="btnGoRecord"
            href="#"
            class="flex-1 inline-flex items-center justify-center gap-2 rounded-2xl bg-emerald-600 py-4 text-base font-black text-white shadow-sm hover:bg-emerald-700 active:scale-95 transition"
          >
            <i data-lucide="file-text" class="h-5 w-5"></i>
            <span>活動記録を入力する</span>
          </a>
          <button
            type="button"
            id="btnDeclineQuest"
            class="inline-flex items-center justify-center gap-1 rounded-2xl border border-red-200 bg-white px-5 py-4 text-base font-black text-red-600 hover:bg-red-50 whitespace-nowrap"
            onclick="confirmDeclineQuest()"
          >
            辞退する
          </button>
        </div>
      </div>

      <!-- 更新コントロールバー -->
      <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs text-base">
        <button
          type="button"
          id="btnRefresh"
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 font-bold text-slate-800 hover:bg-slate-100 active:scale-95 transition"
          onclick="fetchBoardQuests(true)"
        >
          <i data-lucide="refresh-cw" class="h-5 w-5 text-slate-500"></i>
          <span>最新の案件に更新</span>
        </button>
        <span id="syncStatusBar" class="text-sm font-semibold text-slate-500">最終更新: --:--</span>
      </div>

      <!-- 募集中案件リストコンテナ -->
      <section class="space-y-4">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-base font-black tracking-wider text-slate-600 uppercase">募集中の一覧</h2>
          <span id="openCountBadge" class="rounded-full bg-blue-100 px-3.5 py-1 text-sm font-black text-blue-900">0件</span>
        </div>

        <div id="questListArea" class="space-y-5">
          <!-- 動的カード挿入エリア -->
        </div>

        <!-- 案件ゼロ時のステート -->
        <div id="questEmptyState" class="hidden rounded-3xl border border-slate-200 bg-white p-12 text-center space-y-3">
          <i data-lucide="inbox" class="h-14 w-14 text-slate-300 mx-auto"></i>
          <p class="text-lg font-black text-slate-800">現在募集中の案件はありません</p>
          <p class="text-base text-slate-500">新しい依頼が入り次第、ここに表示されます。</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    const BOARD_LIFF_ID = "2011784961-QoryA7zc";

    let currentDriver = null;
    let currentQuests = [];
    let activeQuestData = null;
    let lineUserId = '';

    function refreshLucide() {
      if (window.lucide) lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatLocationText(locStr) {
      if (!locStr) return '未指定';
      const str = String(locStr).trim();
      const latLngRegex = /^([0-9]+\.[0-9]+)\s*,\s*([0-9]+\.[0-9]+)$/;
      if (latLngRegex.test(str)) {
        return `指定地点 (${str})`;
      }
      return str;
    }

    function showCustomAlert(title, message, isOkOnly = true, callback = null) {
      const dialog = document.getElementById('customDialog');
      document.getElementById('dialogTitle').textContent = title;
      document.getElementById('dialogMessage').textContent = message;
      const btnArea = document.getElementById('dialogButtons');

      if (isOkOnly) {
        btnArea.innerHTML = `<button type="button" id="dialogBtnOk" class="w-full rounded-2xl bg-blue-600 py-4 text-base font-bold text-white shadow-xs hover:bg-blue-700">OK</button>`;
        document.getElementById('dialogBtnOk').onclick = () => {
          dialog.classList.add('hidden');
          if (callback) callback();
        };
      } else {
        btnArea.innerHTML = `
          <button type="button" id="dialogBtnCancel" class="flex-1 rounded-2xl border border-slate-200 bg-white py-4 text-base font-bold text-slate-700 hover:bg-slate-50">いいえ</button>
          <button type="button" id="dialogBtnConfirm" class="flex-1 rounded-2xl bg-red-600 py-4 text-base font-bold text-white shadow-xs hover:bg-red-700">はい</button>
        `;
        document.getElementById('dialogBtnCancel').onclick = () => dialog.classList.add('hidden');
        document.getElementById('dialogBtnConfirm').onclick = () => {
          dialog.classList.add('hidden');
          if (callback) callback();
        };
      }
      dialog.classList.remove('hidden');
      refreshLucide();
    }

    function showBlockingLoading(title, desc) {
      document.getElementById('blockingTitle').textContent = title;
      document.getElementById('blockingDesc').textContent = desc;
      document.getElementById('blockingOverlay').classList.remove('hidden');
      refreshLucide();
    }

    function hideBlockingLoading() {
      document.getElementById('blockingOverlay').classList.add('hidden');
    }

    function hideInitialLoading() {
      const box = document.getElementById('initialLoadingBox');
      if (box) box.style.display = 'none';
    }

    function showAuthView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('boardSection').style.display = 'none';
      refreshLucide();
    }

    function showBoardView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('boardSection').style.display = 'block';
      if (currentDriver) {
        document.getElementById('driverBadgeText').textContent = `${currentDriver.name} (ID:${currentDriver.id})`;
      }
      fetchBoardQuests();
      refreshLucide();
    }

    async function executeAuth(targetId = null, targetPhone4 = null) {
      const dId = targetId || document.getElementById('authDriverId').value.trim();
      const p4 = targetPhone4 || document.getElementById('authPhone4').value.trim();

      if (!dId || !p4) {
        showCustomAlert('入力エラー', '登録番号と電話番号の下4桁を入力してください。');
        return;
      }

      showBlockingLoading('認証中', '登録情報を確認しています...');

      try {
        const payload = {
          action: 'authDriver',
          driverId: dId,
          phone4: p4,
          lineUserId: lineUserId || ''
        };

        const res = await fetch(`${GAS_API_URL}?action=authDriver`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error(`HTTPエラー: ${res.status}`);
        }

        const result = await res.json();

        if (result.success && result.driver) {
          currentDriver = result.driver;
          localStorage.setItem('odekake_driver', JSON.stringify(result.driver));
          hideBlockingLoading();
          showBoardView();
          if (targetId) {
            showCustomAlert('認証完了', `ようこそ、${result.driver.name} 様！\n自動ログインしました。`);
          }
        } else {
          hideBlockingLoading();
          showCustomAlert('認証エラー', result.message || '登録番号または電話番号の下4桁が一致しませんでした。');
        }
      } catch (err) {
        hideBlockingLoading();
        console.error("Auth execution error:", err);
        showCustomAlert('通信エラー', 'サーバーとの通信に失敗しました。\n電波状況をご確認のうえ、再度お試しください。\n(' + err.message + ')');
      }
    }

    function logoutDriver() {
      showCustomAlert('ログアウト確認', 'この端末のドライバー認証を解除しますか？', false, () => {
        localStorage.removeItem('odekake_driver');
        currentDriver = null;
        showAuthView();
      });
    }

    async function fetchBoardQuests(isManualRefresh = false) {
      if (!currentDriver) return;
      const statusBar = document.getElementById('syncStatusBar');
      if (statusBar && isManualRefresh) statusBar.textContent = '最新情報を取得中...';

      try {
                const res = await fetch(`${GAS_API_URL}?action=getOpenQuests&_t=${Date.now()}`);
        const data = await res.json();
        currentQuests = (data && data.success) ? (data.quests || []) : [];
        
        // ★追加：案件の表示順を日付が近い順（昇順）にソート
        currentQuests.sort((a, b) => {
          const timeA = a.sortTime || (a.targetDate ? new Date(a.targetDate + ' ' + (a.targetTime || '00:00')).getTime() : 0);
          const timeB = b.sortTime || (b.targetDate ? new Date(b.targetDate + ' ' + (b.targetTime || '00:00')).getTime() : 0);
          return timeA - timeB;
        });

        renderQuests(currentQuests);


        await checkActiveQuestForDriver();

        if (statusBar) {
          statusBar.textContent = `最終更新: ${new Date().toLocaleTimeString('JP-ja', { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (e) {
        if (statusBar) statusBar.textContent = '更新エラー';
      }
    }

    async function checkActiveQuestForDriver() {
      if (!currentDriver) return;
      try {
        const res = await fetch(`${GAS_API_URL}?action=getActiveQuestForDriver&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
        const data = await res.json();
        const banner = document.getElementById('activeQuestBanner');

        if (data.success && data.quest) {
          activeQuestData = data.quest;
          document.getElementById('bannerQid').textContent = `#${activeQuestData.id}`;
          document.getElementById('bannerDate').textContent = activeQuestData.formattedDate || '日時指定';
          document.getElementById('bannerRoute').textContent = `${formatLocationText(activeQuestData.pickup)} ➔ ${formatLocationText(activeQuestData.dropoff)}`;
          document.getElementById('btnGoRecord').href = `https://liff.line.me/2011743949-unqD1uQo?qid=${activeQuestData.id}`;
          banner.classList.remove('hidden');
        } else {
          activeQuestData = null;
          banner.classList.add('hidden');
        }
      } catch (e) {}
    }

        function renderQuests(quests) {
      const area = document.getElementById('questListArea');
      const emptyState = document.getElementById('questEmptyState');
      const badge = document.getElementById('openCountBadge');

      badge.textContent = `${quests.length}件`;
      area.innerHTML = '';

      if (quests.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      quests.forEach(q => {
        const card = document.createElement('div');
        
        // ★追加：要対応・至急案件の判定（GAS側から isUrgent や isWarning、または直近フラグがある場合）
        const isUrgent = q.isUrgent || q.isWarning || false;
        
        // 要対応時は背景色と枠線を目立つアンバー（警告）トーンに変更
        card.className = isUrgent
          ? "rounded-3xl border-2 border-amber-300 bg-amber-50/50 p-6 shadow-sm space-y-4 transition hover:shadow-md"
          : "rounded-3xl border border-slate-200 bg-white p-6 shadow-sm space-y-4 transition hover:shadow-md";

        const cleanPickup = formatLocationText(q.pickup);
        const cleanDropoff = formatLocationText(q.dropoff);


        let navUrl = '';
        if (q.pickup && q.dropoff && q.pickup !== '未指定' && q.dropoff !== '未指定') {
          navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(cleanPickup)}&destination=${encodeURIComponent(cleanDropoff)}&travelmode=driving`;
        } else if (q.dropoff && q.dropoff !== '未指定') {
          navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanDropoff)}`;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="font-mono text-base font-bold text-slate-500 whitespace-nowrap">#${escapeHtml(q.id)}</span>
            <span class="rounded-full bg-blue-50 px-3.5 py-1.5 text-sm sm:text-base font-extrabold text-blue-900 border border-blue-100 text-right truncate">${escapeHtml(q.dateText)}</span>
          </div>

          <div class="space-y-1 pt-1">
            <div class="text-sm font-bold text-slate-500">出発地</div>
            <div class="text-lg font-black text-slate-900 leading-snug break-words">${escapeHtml(cleanPickup)}</div>
          </div>

          <div class="flex justify-center py-0.5 text-slate-400">
            <i data-lucide="arrow-down" class="h-6 w-6"></i>
          </div>

          <div class="space-y-1">
            <div class="text-sm font-bold text-slate-500">行き先</div>
            <div class="text-lg font-black text-blue-700 leading-snug break-words">${escapeHtml(cleanDropoff)}</div>
          </div>

          <div class="rounded-2xl bg-slate-50 p-4 text-base space-y-2.5 border border-slate-200 text-slate-800 font-medium">
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-bold whitespace-nowrap">乗車人数:</span>
              <strong class="text-slate-900 text-right">${escapeHtml(q.passengers)}</strong>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-bold whitespace-nowrap">片道•往復:</span>
              <strong class="text-slate-900 text-right">${escapeHtml(q.tripPlan)}</strong>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-bold whitespace-nowrap">依頼者名:</span>
              <strong class="text-slate-900 text-right truncate max-w-[180px]">${escapeHtml(q.userNameMasked)}</strong>
            </div>
            ${q.note ? `<div class="pt-2 text-slate-600 border-t border-slate-200 leading-snug break-words">備考: ${escapeHtml(q.note)}</div>` : ''}
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 pt-2">
            ${navUrl ? `
              <a href="${escapeHtml(navUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 rounded-2xl border-2 border-slate-200 bg-white px-5 py-4 text-base font-bold text-slate-800 hover:bg-slate-50 shadow-2xs whitespace-nowrap flex-shrink-0">
                <i data-lucide="navigation" class="h-5 w-5 text-blue-600 flex-shrink-0"></i>
                <span>目安ルート</span>
              </a>
            ` : ''}
            <button
              type="button"
              class="flex-1 inline-flex items-center justify-center gap-2.5 rounded-2xl bg-blue-600 py-4 text-base sm:text-lg font-black text-white shadow-md hover:bg-blue-700 active:scale-95 transition whitespace-nowrap flex-shrink-0"
              onclick="acceptQuest('${escapeHtml(q.id)}')"
            >
              <i data-lucide="check" class="h-6 w-6 flex-shrink-0"></i>
              <span>この案件を受託する</span>
            </button>
          </div>
        `;
        area.appendChild(card);
      });
      refreshLucide();
    }

    async function acceptQuest(qid) {
      if (!currentDriver) return;
      showCustomAlert('受託確認', `案件 #${qid} を受託しますか？\n受託すると依頼主とご本人にLINE通知が送信されます。`, false, async () => {
        showBlockingLoading('受託処理中', '案件を受託しています...');
        try {
          const res = await fetch(`${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(qid)}&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
          const data = await res.json();
          hideBlockingLoading();
          if (data.success) {
            showCustomAlert('受託完了', '案件を受託しました！活動記録画面より運行を開始してください。', true, () => {
              fetchBoardQuests(true);
            });
          } else {
            showCustomAlert('受託エラー', data.message || '受託に失敗しました。');
          }
        } catch (e) {
          hideBlockingLoading();
          showCustomAlert('通信エラー', '通信に失敗しました: ' + e.message);
        }
      });
    }

    function confirmDeclineQuest() {
      if (!activeQuestData) return;
      showCustomAlert('受託辞退の確認', `案件 #${activeQuestData.id} の受託を辞退して掲示板に再募集しますか？`, false, async () => {
        showBlockingLoading('辞退処理中', '受託をキャンセルしています...');
        try {
          const res = await fetch(`${GAS_API_URL}?action=cancelQuest&qid=${encodeURIComponent(activeQuestData.id)}&driverId=${encodeURIComponent(currentDriver.id)}&_t=${Date.now()}`);
          const data = await res.json();
          hideBlockingLoading();
          if (data.success) {
            showCustomAlert('辞退完了', '受託をキャンセルしました。', true, () => {
              fetchBoardQuests(true);
            });
          } else {
            showCustomAlert('エラー', data.message || '辞退処理に失敗しました。');
          }
        } catch (e) {
          hideBlockingLoading();
          showCustomAlert('通信エラー', '通信に失敗しました: ' + e.message);
        }
      });
    }

    /**
     * スマホの標準カレンダーへ予定を追加する関数
     * @param {Object} quest - 案件データオブジェクト (id, dateText, targetTime, pickup, dropoff, userNameMasked, note)
     */
    function addToDeviceCalendar(quest) {
      if (!quest) {
        showCustomAlert('エラー', '案件データが見つかりませんでした。');
        return;
      }

      const rawDate = quest.dateText || quest.targetDate || '';
      const dateMatch = rawDate.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      
      let dateStr = '';
      if (dateMatch) {
        const y = dateMatch[1];
        const m = String(dateMatch[2]).padStart(2, '0');
        const d = String(dateMatch[3]).padStart(2, '0');
        dateStr = `${y}-${m}-${d}`;
      } else {
        dateStr = new Date().toISOString().split('T')[0];
      }

      const timeStr = quest.targetTime || '09:00';
      const startDateTime = new Date(`${dateStr}T${timeStr}:00`);
      const endDateTime = new Date(startDateTime.getTime() + 2 * 60 * 60 * 1000);

      const formatGCalTime = (date) => {
        return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
      };

      const startTimeFormatted = formatGCalTime(startDateTime);
      const endTimeFormatted = formatGCalTime(endDateTime);

      const title = encodeURIComponent(`【おでかけ送迎】#${quest.id} ${quest.userNameMasked || '利用者'} 様`);
      const location = encodeURIComponent(quest.pickup || '指定場所');
      const details = encodeURIComponent(
        `行先: ${quest.dropoff}\n片道・往復: ${quest.tripPlan || '往復'}\n乗車人数: ${quest.passengers || '1名'}\n備考: ${quest.note || '特になし'}\n\nおでかけサポート運行管理`
      );

      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startTimeFormatted}/${endTimeFormatted}&location=${location}&details=${details}`;

      window.open(gcalUrl, '_blank', 'noopener,noreferrer');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      refreshLucide();

      // 1. LINE LIFF初期化（失敗しても処理を継続）
      try {
        if (window.liff) {
          await liff.init({ liffId: BOARD_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            lineUserId = profile.userId || '';
          }
        }
      } catch (e) {
        console.warn("LIFF init bypassed/failed:", e);
      }

      // 2. URLパラメータでの自動認証
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlDriverId = urlParams.get('authDriverId');
        const urlPhone4 = urlParams.get('phone4');
        if (urlDriverId && urlPhone4) {
          await executeAuth(urlDriverId.trim(), urlPhone4.trim());
          return;
        }
      } catch (e) {
        console.warn("URL auth check failed:", e);
      }

      // 3. ローカルストレージからの復元
      try {
        const savedDriver = localStorage.getItem('odekake_driver');
        if (savedDriver) {
          currentDriver = JSON.parse(savedDriver);
          if (currentDriver && currentDriver.id) {
            showBoardView();
            return;
          }
        }
      } catch (e) {
        console.warn("Storage parse error, clearing:", e);
        localStorage.removeItem('odekake_driver');
      }

      // 4. 未認証時は確実に認証画面を表示
      showAuthView();
    });
  </script>
</body>
