<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 運行掲示板</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --system-green: #28CD41;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --border-color: rgba(60, 60, 67, 0.12);
      --danger-red: #FF3B30;
      --warn-amber: #FF9500;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 40px;
      line-height: 1.5;
    }
    .lucide {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.18em;
      stroke-width: 2.2;
      display: inline-block;
    }
    header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5EA;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .driver-badge {
      font-size: 0.8rem;
      background: #EFF6FF;
      color: var(--primary-blue);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
      padding-left: 4px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 14px;
      border: 0.5px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input[type="tel"] {
      width: 100%;
      height: 48px;
      border: 1.5px solid #E5E5EA;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 1.05rem;
      background: #FAFAFA;
      outline: none;
    }
    input:focus {
      border-color: var(--primary-blue);
      background: #FFF;
    }
    .btn-action {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      background: var(--primary-blue);
      color: #FFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-refresh {
      background: #FFFFFF;
      border: 1px solid #E5E5EA;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .quest-card {
      background: #FFF;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid #E5E5EA;
      margin-bottom: 12px;
    }
    .quest-card.urgent {
      border-color: #F87171;
      background: #FFF5F5;
    }
    .urgent-banner {
      background: #EF4444;
      color: #FFF;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .quest-id {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .quest-time-badge {
      background: #EFF6FF;
      color: var(--primary-blue);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .trip-plan-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #F1F5F9;
      color: #334155;
    }
    .quest-route {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .quest-details {
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px dashed #E5E5EA;
      padding-top: 8px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .btn-accept {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      background: var(--system-green);
      color: #FFF;
      font-weight: 800;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .empty-box {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: #FFF;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 22px 18px;
      text-align: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-modal-cancel {
      height: 44px;
      background: var(--surface-secondary);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-modal-confirm {
      height: 44px;
      background: var(--primary-blue);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      color: #FFF;
      cursor: pointer;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.9s linear infinite;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-title">
        <i data-lucide="car"></i>
        <span>運行掲示板</span>
      </div>
      <div id="driverBadgeArea" style="display:none;" class="driver-badge">
        <span id="dispDriverName">ドライバー</span>
        <button type="button" class="btn-logout" onclick="logoutDriver()">解除</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="initialLoadingBox" class="empty-box" style="margin-top:20px;">
      <i data-lucide="loader-2" class="animate-spin" style="width:32px; height:32px; color:var(--primary-blue);"></i>
      <p style="margin-top:8px;">掲示板を読み込み中...</p>
    </div>

    <!-- 認証セクション -->
    <div id="authSection" class="card" style="display:none;">
      <h2 style="font-size:1.15rem; font-weight:800; margin-bottom:12px; text-align:center;">ドライバー認証</h2>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:14px; text-align:center;">
        初回のみ認証が必要です。一度認証すると次回から自動ログインします。
      </p>
      <div class="form-group">
        <label>ドライバー登録番号（半角5桁）</label>
        <input type="tel" id="authDriverId" placeholder="例: 10101" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>暗証番号（電話番号下4桁）</label>
        <input type="tel" id="authPhone4" placeholder="例: 1234" maxlength="4" inputmode="numeric">
      </div>
      <button type="button" class="btn-action" id="btnAuth" onclick="executeAuth()">
        <i data-lucide="key"></i>
        <span>認証する</span>
      </button>
    </div>

    <!-- 掲示板セクション -->
    <div id="boardSection" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button type="button" class="btn-refresh" id="btnRefresh" onclick="fetchBoardQuests(true)">
          <i data-lucide="refresh-cw" id="refreshIcon"></i>
          <span>最新の案件に更新</span>
        </button>
        <div id="syncStatusBar" class="status-bar"></div>
      </div>
      <div id="questListArea"></div>
    </div>
  </div>

  <!-- 確認・通知モーダル -->
  <div id="customDialogOverlay" class="modal-overlay" style="display:none;" onclick="handleDialogOverlayClick(event)">
    <div class="modal-card">
      <div id="customDialogIconArea" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
      <h3 id="customDialogTitle" class="modal-title">通知</h3>
      <div id="customDialogMessage" style="font-size:0.9rem; color:var(--text-main); line-height:1.5; white-space:pre-wrap; text-align:left; background:var(--surface-secondary); padding:12px; border-radius:12px;"></div>
      <div class="modal-buttons" id="customDialogButtons">
        <button type="button" class="btn-modal-cancel" id="btnDialogCancel" onclick="closeCustomDialog(false)">キャンセル</button>
        <button type="button" class="btn-modal-confirm" id="btnDialogOk" onclick="closeCustomDialog(true)">OK</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function createTripBadgeHtml(tripPlan) {
      const text = String(tripPlan || '往復').trim();
      if (text.includes('片道')) {
        return `<div class="trip-plan-badge"><i data-lucide="arrow-right"></i><span>片道（送り届けのみ）</span></div>`;
      }
      return `<div class="trip-plan-badge"><i data-lucide="repeat"></i><span>${escapeHtml(text)}</span></div>`;
    }

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    const LOCAL_CACHE_KEY = 'odekake_board_quests_cache_v3';

    let currentDriver = null;
    let currentQuests = [];
    let isProcessingAccept = false;
    let lineUserId = '';

    function refreshLucide() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    let customDialogResolve = null;
    function showCustomAlert(message, title = 'お知らせ', iconName = 'info', iconColor = 'var(--primary-blue)') {
      return new Promise((resolve) => {
        document.getElementById('customDialogIconArea').innerHTML = `<i data-lucide="${iconName}" style="width:44px; height:44px; color:${iconColor};"></i>`;
        document.getElementById('customDialogTitle').textContent = title;
        document.getElementById('customDialogMessage').textContent = message;
        document.getElementById('btnDialogCancel').style.display = 'none';
        const okBtn = document.getElementById('btnDialogOk');
        okBtn.style.gridColumn = '1 / -1';
        okBtn.textContent = '閉じる';
        customDialogResolve = resolve;
        document.getElementById('customDialogOverlay').style.display = 'flex';
        refreshLucide();
      });
    }

    function showCustomConfirm(message, title = 'ご確認', iconName = 'help-circle', iconColor = 'var(--primary-blue)') {
      return new Promise((resolve) => {
        document.getElementById('customDialogIconArea').innerHTML = `<i data-lucide="${iconName}" style="width:44px; height:44px; color:${iconColor};"></i>`;
        document.getElementById('customDialogTitle').textContent = title;
        document.getElementById('customDialogMessage').textContent = message;
        document.getElementById('btnDialogCancel').style.display = 'block';
        const okBtn = document.getElementById('btnDialogOk');
        okBtn.style.gridColumn = '';
        okBtn.textContent = 'はい';
        customDialogResolve = resolve;
        document.getElementById('customDialogOverlay').style.display = 'flex';
        refreshLucide();
      });
    }

    function closeCustomDialog(result) {
      document.getElementById('customDialogOverlay').style.display = 'none';
      if (customDialogResolve) {
        const cb = customDialogResolve;
        customDialogResolve = null;
        cb(result);
      }
    }

    function handleDialogOverlayClick(e) {
      if (e.target.id === 'customDialogOverlay') closeCustomDialog(false);
    }

    function hideInitialLoading() {
      const loadBox = document.getElementById('initialLoadingBox');
      if (loadBox) loadBox.style.display = 'none';
    }

    function showAuthView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('boardSection').style.display = 'none';
      document.getElementById('driverBadgeArea').style.display = 'none';
      refreshLucide();
    }

    function showBoardView() {
      hideInitialLoading();
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('boardSection').style.display = 'block';
      document.getElementById('driverBadgeArea').style.display = 'flex';
      document.getElementById('dispDriverName').textContent = `${currentDriver.name || 'ボランティア'} (ID:${currentDriver.id})`;

      const localCached = localStorage.getItem(LOCAL_CACHE_KEY);
      if (localCached) {
        try {
          const cachedQuests = JSON.parse(localCached);
          if (cachedQuests && cachedQuests.length > 0) {
            currentQuests = cachedQuests;
            renderQuests(cachedQuests);
          }
        } catch (e) {}
      }
      fetchBoardQuests(false);
      refreshLucide();
    }

    async function logoutDriver() {
      const ok = await showCustomConfirm(
        '登録情報の連携を解除しますか？\n（再度ログインする際は登録番号と暗証番号が必要になります）',
        '連携解除の確認',
        'alert-triangle',
        'var(--danger-red)'
      );
      if (ok) {
        localStorage.removeItem('odekake_driver');
        localStorage.removeItem(LOCAL_CACHE_KEY);
        currentDriver = null;
        showAuthView();
      }
    }

    async function executeAuth(targetId = null, targetPhone4 = null) {
      const driverId = targetId || document.getElementById('authDriverId').value.trim();
      const phone4 = targetPhone4 || document.getElementById('authPhone4').value.trim();

      if (!driverId || !phone4) {
        await showCustomAlert('登録番号と暗証番号（電話番号下4桁）を入力してください。', '入力確認', 'alert-circle', 'var(--warn-amber)');
        return false;
      }

      const btn = document.getElementById('btnAuth');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i><span>認証中...</span>';
        refreshLucide();
      }

      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const url = `${GAS_API_URL}?action=authDriver&driverId=${encodeURIComponent(driverId)}&phone4=${encodeURIComponent(phone4)}&lineUserId=${encodeURIComponent(lineUserId)}${cacheBuster}`;
        const res = await (await fetch(url)).json();

        if (res.success && res.driver) {
          currentDriver = res.driver;
          localStorage.setItem('odekake_driver', JSON.stringify(currentDriver));
          showBoardView();
          if (targetId) {
            await showCustomAlert(`ようこそ、${res.driver.name} 様！\n掲示板への自動ログインと公式LINEの連携が完了しました。`, 'LINE連携完了', 'check-circle-2', 'var(--system-green)');
          }
          return true;
        } else {
          await showCustomAlert(res.message || '登録情報と一致しませんでした。', '認証エラー', 'alert-circle', 'var(--danger-red)');
          showAuthView();
          return false;
        }
      } catch (e) {
        await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', 'alert-circle', 'var(--danger-red)');
        showAuthView();
        return false;
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="key"></i><span>認証する</span>';
          refreshLucide();
        }
      }
    }

    async function fetchBoardQuests(isManualRefresh = false) {
      const listArea = document.getElementById('questListArea');
      const statusBar = document.getElementById('syncStatusBar');
      const btn = document.getElementById('btnRefresh');
      const icon = document.getElementById('refreshIcon');

      if (icon) icon.classList.add('animate-spin');
      if (btn) btn.disabled = true;

      if (listArea.children.length === 0) {
        listArea.innerHTML = `<div class="empty-box"><i data-lucide="loader-2" class="animate-spin" style="width:28px; height:28px; color:var(--primary-blue);"></i><p style="margin-top:6px;">案件を取得中...</p></div>`;
        refreshLucide();
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const url = `${GAS_API_URL}?action=getOpenQuests${cacheBuster}`;
        const res = await (await fetch(url, { signal: controller.signal })).json();
        clearTimeout(timeoutId);

        const quests = res.quests || res.data || [];
        currentQuests = quests;
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(quests));
        renderQuests(quests);

        if (statusBar) {
          statusBar.textContent = `最終更新: ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (e) {
        clearTimeout(timeoutId);
        if (statusBar) {
          statusBar.textContent = (e.name === 'AbortError') ? 'タイムアウト' : '更新エラー';
        }
      } finally {
        if (icon) icon.classList.remove('animate-spin');
        if (btn) btn.disabled = false;
        hideInitialLoading();
        refreshLucide();
      }
    }

    function renderQuests(quests) {
      const listArea = document.getElementById('questListArea');
      if (!quests || quests.length === 0) {
        listArea.innerHTML = `<div class="empty-box"><i data-lucide="check-circle" style="width:32px; height:32px; color:var(--system-green);"></i><p style="margin-top:8px;">現在募集中の送迎案件はありません</p></div>`;
        refreshLucide();
        return;
      }

      listArea.innerHTML = '';
      quests.forEach(q => {
        const isUrgent = !!q.isUrgent;
        const card = document.createElement('div');
        card.className = isUrgent ? 'quest-card urgent' : 'quest-card';

        card.innerHTML = `
          ${isUrgent ? `<div class="urgent-banner"><i data-lucide="alert-circle"></i><span>【至急】運行日が迫っています</span></div>` : ''}
          <div class="quest-header">
            <span class="quest-id">案件 #${escapeHtml(q.id)}</span>
            <span class="quest-time-badge"><i data-lucide="clock"></i> 集合: ${escapeHtml(q.dateText)}</span>
          </div>
          ${createTripBadgeHtml(q.tripPlan)}
          <div class="quest-route">
            <span>${escapeHtml(q.pickup)}</span>
            <i data-lucide="arrow-right" style="color:var(--text-muted);"></i>
            <span style="color:var(--primary-blue);">${escapeHtml(q.dropoff)}</span>
          </div>
          <div class="quest-details">
            <div><strong>乗車人数:</strong> ${escapeHtml(q.passengers || '1名')}（${escapeHtml(q.userNameMasked || '登録利用者 様')}）</div>
            ${q.note ? `<div style="margin-top:2px;"><strong>介助・備考:</strong> ${escapeHtml(q.note)}</div>` : ''}
          </div>
          <button type="button" class="btn-accept" onclick="confirmAcceptQuest('${escapeHtml(q.id)}')">
            <i data-lucide="check"></i>
            <span>この案件を受託する</span>
          </button>
        `;
        listArea.appendChild(card);
      });
      refreshLucide();
    }

    async function confirmAcceptQuest(qid) {
      if (isProcessingAccept) return;
      if (!currentDriver || !currentDriver.id) {
        showAuthView();
        return;
      }

      const quest = currentQuests.find(q => String(q.id) === String(qid));
      const qText = quest ? `【案件 #${qid}】\n日時: ${quest.dateText}\n行先: ${quest.dropoff}\n利用者: ${quest.userNameMasked}` : `案件 #${qid}`;

      const ok = await showCustomConfirm(
        `${qText}\n\nこの案件を受託しますか？\n受託すると公式LINEへ運行詳細と活動記録URLが届きます。`,
        '受託の確認',
        'car',
        'var(--system-green)'
      );
      if (!ok) return;

      isProcessingAccept = true;
      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const url = `${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(qid)}&driverId=${encodeURIComponent(currentDriver.id)}${cacheBuster}`;
        const res = await (await fetch(url)).json();

        if (res.success) {
          await showCustomAlert(`案件 [#${qid}] の受託が完了しました！\n公式LINEへ案内メッセージをお送りしましたのでご確認ください。安全運転でお願いいたします。`, '受託完了', 'check-circle-2', 'var(--system-green)');
          fetchBoardQuests(true);
        } else {
          await showCustomAlert(res.message || '受託できませんでした。既に他のドライバーが受託した可能性があります。', '受託不可', 'alert-circle', 'var(--danger-red)');
          fetchBoardQuests(true);
        }
      } catch (e) {
        await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', 'alert-circle', 'var(--danger-red)');
      } finally {
        isProcessingAccept = false;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshLucide();

      const params = new URLSearchParams(window.location.search);
      const urlDriverId = params.get('authDriverId');
      const urlPhone4 = params.get('phone4');

      if (urlDriverId && urlPhone4) {
        hideInitialLoading();
        executeAuth(urlDriverId.trim(), urlPhone4.trim());
        return;
      }

      const saved = localStorage.getItem('odekake_driver');
      if (saved) {
        try {
          currentDriver = JSON.parse(saved);
          if (currentDriver && currentDriver.id) {
            showBoardView();
            return;
          }
        } catch (e) {}
      }

      showAuthView();
    });
  </script>
</body>
</html>
