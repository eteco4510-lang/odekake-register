<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 運行掲示板</title>
  <style>
    :root {
      /* Apple HIG System Colors (Light Mode) */
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --system-green: #28CD41;
      --system-green-Accessible: #248A3D;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --border-color: rgba(60, 60, 67, 0.12);
      --separator-opaque: #E5E5EA;
      --warn-amber: #C93400;
      --warn-bg: #FFF9E6;
      --danger-red: #FF3B30;
      --danger-bg: #FFF2F2;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-urgent: 0 8px 28px rgba(255, 59, 48, 0.14), 0 2px 6px rgba(255, 59, 48, 0.08);
      --shadow-modal: 0 24px 48px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-variant-numeric: tabular-nums;
      padding-bottom: calc(env(safe-area-inset-bottom) + 56px);
      overscroll-behavior-y: contain; /* ネイティブリロードとの衝突を抑制 */
    }

    /* HIG Translucent Navigation Bar */
    header {
      background-color: rgba(255, 255, 255, 0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.18);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-content {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .driver-badge {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary-blue);
      background-color: rgba(0, 122, 255, 0.1);
      padding: 6px 12px;
      border-radius: 9999px;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-logout {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(60, 60, 67, 0.08);
      border: none;
      padding: 2px 8px;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s var(--ease-spring);
    }

    .btn-logout:active {
      background: rgba(60, 60, 67, 0.18);
      transform: scale(0.95);
    }

    /* プル・トゥ・リフレッシュ UI */
    .ptr-container {
      overflow: hidden;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.22s var(--ease-spring);
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      gap: 8px;
    }

    .ptr-icon {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .ptr-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0, 122, 255, 0.25);
      border-top-color: var(--primary-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 16px 24px;
    }

    /* HIG Inset Grouped Card */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 22px;
      margin-bottom: 18px;
      border: 0.5px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    input[type="tel"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1.5px solid transparent;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      background-color: var(--surface-secondary);
      transition: all 0.2s var(--ease-spring);
    }

    input[type="tel"]::placeholder {
      color: #AEAEB2;
    }

    input:focus {
      background-color: #FFFFFF;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
      outline: none;
    }

    .btn-action {
      width: 100%;
      height: 54px;
      background-color: var(--primary-blue);
      color: #FFFFFF;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: all 0.2s var(--ease-spring);
    }

    .btn-action:active {
      background-color: var(--primary-hover);
      transform: scale(0.98);
    }

    .btn-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-refresh {
      width: 100%;
      height: 46px;
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 0.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary-blue);
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.2s var(--ease-spring);
    }

    .btn-refresh:active {
      background-color: #FFFFFF;
      transform: scale(0.98);
    }

    .sync-status-bar {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 14px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Quest Cards */
    .quest-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 22px 20px;
      margin-bottom: 18px;
      border: 0.5px solid var(--border-color);
      box-shadow: var(--shadow-card);
      transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-spring);
    }

    .quest-card.urgent-card {
      background-color: #FFFFFF;
      border: 1.5px solid rgba(255, 59, 48, 0.45);
      box-shadow: var(--shadow-urgent);
    }

    .urgent-banner {
      background-color: rgba(255, 59, 48, 0.1);
      color: #D70015;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--separator-opaque);
    }

    .quest-id-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #FFFFFF;
      background-color: #1C1C1E;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.01em;
    }

    .agency-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: #C93400;
      background-color: rgba(255, 149, 0, 0.14);
      padding: 4px 10px;
      border-radius: 9999px;
      border: none;
    }

    .trip-plan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 14px;
      border: none;
    }

    .trip-plan-badge.oneway {
      background-color: rgba(0, 122, 255, 0.1);
      color: #0062CC;
    }

    .trip-plan-badge.round-short {
      background-color: rgba(52, 199, 89, 0.12);
      color: #1E7E34;
    }

    .trip-plan-badge.round-medium {
      background-color: rgba(255, 149, 0, 0.14);
      color: #B25000;
    }

    .trip-plan-badge.round-long {
      background-color: rgba(255, 45, 85, 0.1);
      color: #D30F45;
    }

    .quest-datetime-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 16px;
    }

    .quest-date {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .quest-time-badge {
      font-size: 1.05rem;
      font-weight: 700;
      color: #B25000;
      background-color: rgba(255, 149, 0, 0.14);
      border: 1px solid rgba(255, 149, 0, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
    }

    /* HIG Grouped Route Box */
    .route-container {
      background-color: var(--surface-secondary);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: none;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.1);
      line-height: 1.4;
    }

    .route-row:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .route-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 58px;
      flex-shrink: 0;
    }

    .route-link {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-decoration: none;
      word-break: break-all;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #FFFFFF;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.15s var(--ease-spring);
    }

    .route-link:active {
      background-color: rgba(0, 122, 255, 0.08);
      transform: scale(0.98);
    }

    .quest-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
      font-weight: 600;
    }

    .note-box {
      background-color: #FFFBF0;
      border: 1px solid rgba(255, 149, 0, 0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #7A4100;
      line-height: 1.5;
    }

    .note-box-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .note-box-body {
      font-weight: 500;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .btn-accept {
      width: 100%;
      height: 54px;
      background-color: var(--system-green-Accessible);
      color: #FFFFFF;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(36, 138, 61, 0.25);
      transition: all 0.2s var(--ease-spring);
    }

    .btn-accept:active {
      background-color: #1E7031;
      transform: scale(0.98);
    }

    .empty-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 20px;
      border: 0.5px solid var(--border-color);
      box-shadow: var(--shadow-card);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* HIG Modal Sheet / Alert */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.42);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.25s var(--ease-spring);
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px 22px 22px;
      box-shadow: var(--shadow-modal);
      border: 0.5px solid rgba(255, 255, 255, 0.4);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .modal-details-card {
      background: var(--surface-secondary);
      border: none;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .modal-row {
      display: flex;
      font-size: 0.95rem;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.08);
      line-height: 1.4;
    }

    .modal-row:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .modal-label {
      width: 82px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .modal-value {
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-notice-box {
      font-size: 0.84rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 12px;
    }

    .btn-modal-cancel {
      height: 52px;
      background: var(--surface-secondary);
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }

    .btn-modal-cancel:active {
      background: #E5E5EA;
      transform: scale(0.97);
    }

    .btn-modal-confirm {
      height: 52px;
      background: var(--system-green-Accessible);
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(36, 138, 61, 0.28);
      transition: all 0.2s var(--ease-spring);
    }

    .btn-modal-confirm:active {
      background: #1E7031;
      transform: scale(0.97);
    }

    .btn-modal-confirm:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-title">🚗 運行掲示板</div>
    <div id="driverBadgeArea" style="display:none;" class="driver-badge">
      <span id="dispDriverName">ドライバー</span>
      <button class="btn-logout" onclick="logoutDriver()">解除</button>
    </div>
  </div>
</header>

<!-- ★プル・トゥ・リフレッシュ 表示エリア -->
<div id="ptrContainer" class="ptr-container">
  <span id="ptrIcon" class="ptr-icon">↓</span>
  <span id="ptrSpinner" class="ptr-spinner"></span>
  <span id="ptrText">引いて最新に更新</span>
</div>

<div class="container">
  <!-- 初期表示（読み込み中）インジケーター -->
  <div id="initialLoadingBox" class="empty-box" style="margin-top:20px;">
    ⏳ 掲示板を読み込み中...
  </div>

  <!-- エラー検知ボックス -->
  <div id="globalErrorBox" style="display:none; background:#fee2e2; border:2px solid #ef4444; color:#b91c1c; border-radius:12px; padding:16px; margin-bottom:16px; font-weight:bold; font-size:0.95rem;">
  </div>

  <div id="authSection" class="card" style="display:none;">
    <h2 style="font-size:1.15rem; font-weight:800; margin-bottom:12px; text-align:center;">ドライバー認証</h2>
    <div class="form-group">
      <label>ドライバー登録番号</label>
      <input type="tel" id="authDriverId" placeholder="例: 10101" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>登録電話番号（下4桁）</label>
      <input type="tel" id="authPhone4" placeholder="例: 1234" maxlength="4" inputmode="numeric">
    </div>
    <button type="button" class="btn-action" id="btnAuth" onclick="executeAuth()">認証する</button>
  </div>

  <div id="boardSection" style="display:none;">
    <button type="button" class="btn-refresh" id="btnRefresh" onclick="fetchBoardQuests(true)">
      🔄 最新の案件に更新
    </button>
    <div id="syncStatusBar" class="sync-status-bar"></div>
    <div id="questListArea"></div>
  </div>
</div>

<!-- 受託確認カスタムモーダル -->
<div id="acceptModalOverlay" class="modal-overlay" style="display:none;" onclick="handleModalOverlayClick(event)">
  <div class="modal-card">
    <h2 class="modal-title">この案件を受託しますか？</h2>
    <div class="modal-details-card" id="modalDetailsArea"></div>
    <div id="modalNoteArea"></div>
    <div class="modal-notice-box">
      ※受託すると公式LINEへ運行案内が届きます。
    </div>
    <div class="modal-buttons">
      <button type="button" class="btn-modal-cancel" onclick="closeAcceptModal()">やめる</button>
      <button type="button" class="btn-modal-confirm" id="btnConfirmAccept" onclick="confirmAndExecuteAccept()">受託する</button>
    </div>
  </div>
</div>

<!-- ★【新規】Githubホスト名を出さないiOS風カスタムダイアログ（通知・確認・完了） -->
<div id="customDialogOverlay" class="modal-overlay" style="display:none;" onclick="handleCustomDialogOverlayClick(event)">
  <div class="modal-card" style="max-width:360px; text-align:center;">
    <div id="customDialogIcon" style="font-size:2.2rem; margin-bottom:10px;">✔</div>
    <h3 id="customDialogTitle" class="modal-title" style="margin-bottom:10px; font-size:1.15rem;">通知</h3>
    <div id="customDialogMessage" style="font-size:0.95rem; color:var(--text-main); margin-bottom:20px; line-height:1.55; white-space:pre-wrap; text-align:left; background:var(--surface-secondary); padding:14px; border-radius:14px; font-weight:500;"></div>
    <div class="modal-buttons" id="customDialogButtons">
      <button type="button" class="btn-modal-cancel" id="btnCustomDialogCancel" onclick="closeCustomDialog(false)">キャンセル</button>
      <button type="button" class="btn-modal-confirm" id="btnCustomDialogOk" onclick="closeCustomDialog(true)">OK</button>
    </div>
  </div>
</div>

<script>
  window.onerror = function(msg, url, line) {
    var errBox = document.getElementById('globalErrorBox');
    var loadBox = document.getElementById('initialLoadingBox');
    if (loadBox) loadBox.style.display = 'none';
    if (errBox) {
      errBox.style.display = 'block';
      errBox.innerHTML = '⚠️ 画面の読み込み中にエラーが発生しました：<br>' + msg + ' (行: ' + line + ')<br><small>※URLの書き換え箇所をご確認ください。</small>';
    }
  };

  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
  const LOCAL_CACHE_KEY = 'odekake_board_quests_cache_v3';

  let currentDriver = null;
  let currentQuests = [];
  let isProcessingAccept = false;
  let targetAcceptQid = null;

  // ==========================================
  // ★Githubダイアログを出さないカスタムモーダル制御
  // ==========================================
  let customDialogResolve = null;

  function showCustomAlert(message, title = 'お知らせ', icon = 'ℹ️') {
    return new Promise((resolve) => {
      document.getElementById('customDialogIcon').textContent = icon;
      document.getElementById('customDialogTitle').textContent = title;
      document.getElementById('customDialogMessage').textContent = message;

      const cancelBtn = document.getElementById('btnCustomDialogCancel');
      const okBtn = document.getElementById('btnCustomDialogOk');
      cancelBtn.style.display = 'none';
      okBtn.style.gridColumn = '1 / -1';
      okBtn.textContent = '閉じる';
      okBtn.style.backgroundColor = 'var(--primary-blue)';

      customDialogResolve = resolve;
      document.getElementById('customDialogOverlay').style.display = 'flex';
    });
  }

  function showCustomConfirm(message, title = 'ご確認', icon = '❓') {
    return new Promise((resolve) => {
      document.getElementById('customDialogIcon').textContent = icon;
      document.getElementById('customDialogTitle').textContent = title;
      document.getElementById('customDialogMessage').textContent = message;

      const cancelBtn = document.getElementById('btnCustomDialogCancel');
      const okBtn = document.getElementById('btnCustomDialogOk');
      cancelBtn.style.display = 'block';
      okBtn.style.gridColumn = '';
      okBtn.textContent = 'はい';
      okBtn.style.backgroundColor = 'var(--primary-blue)';

      customDialogResolve = resolve;
      document.getElementById('customDialogOverlay').style.display = 'flex';
    });
  }

  function closeCustomDialog(result) {
    document.getElementById('customDialogOverlay').style.display = 'none';
    if (customDialogResolve) {
      const cb = customDialogResolve;
      customDialogResolve = null;
      cb(result);
    }
  }

  function handleCustomDialogOverlayClick(e) {
    if (e.target.id === 'customDialogOverlay') {
      closeCustomDialog(false);
    }
  }

  // ==========================================
  // 初期化・ドライバー状態管理
  // ==========================================
  function hideInitialLoading() {
    var loadBox = document.getElementById('initialLoadingBox');
    if (loadBox) loadBox.style.display = 'none';
  }

  function checkSavedDriver() {
    hideInitialLoading();
    const saved = localStorage.getItem('odekake_driver');
    if (saved) {
      try {
        currentDriver = JSON.parse(saved);
        if (currentDriver && currentDriver.id) {
          showBoardView();
          return;
        }
      } catch (e) {}
    }
    showAuthView();
  }

  function showAuthView() {
    hideInitialLoading();
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('boardSection').style.display = 'none';
    document.getElementById('driverBadgeArea').style.display = 'none';
  }

  function showBoardView() {
    hideInitialLoading();
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('boardSection').style.display = 'block';
    document.getElementById('driverBadgeArea').style.display = 'flex';
    document.getElementById('dispDriverName').textContent = `${currentDriver.name || 'ボランティア'} (ID:${currentDriver.id})`;

    const localCached = localStorage.getItem(LOCAL_CACHE_KEY);
    if (localCached) {
      try {
        const cachedQuests = JSON.parse(localCached);
        if (cachedQuests && cachedQuests.length > 0) {
          currentQuests = cachedQuests;
          renderQuests(cachedQuests);
        }
      } catch (e) {}
    }
    fetchBoardQuests(false);
  }

  async function logoutDriver() {
    const ok = await showCustomConfirm('登録情報の連携を解除しますか？\n（再度ログインする際は登録番号と下4桁が必要になります）', '連携解除の確認', '⚠️');
    if (ok) {
      localStorage.removeItem('odekake_driver');
      localStorage.removeItem(LOCAL_CACHE_KEY);
      currentDriver = null;
      showAuthView();
    }
  }

  async function executeAuth() {
    const driverId = document.getElementById('authDriverId').value.trim();
    const phone4 = document.getElementById('authPhone4').value.trim();
    if (!driverId || !phone4) {
      await showCustomAlert('ドライバー登録番号と電話番号の下4桁を入力してください。', '入力エラー', '⚠️');
      return;
    }

    const btn = document.getElementById('btnAuth');
    btn.disabled = true; btn.textContent = '認証中...';

    try {
      const url = `${GAS_API_URL}?action=authDriver&driverId=${encodeURIComponent(driverId)}&phone4=${encodeURIComponent(phone4)}`;
      const res = await (await fetch(url)).json();
      if (res.success && res.driver) {
        currentDriver = res.driver;
        localStorage.setItem('odekake_driver', JSON.stringify(currentDriver));
        showBoardView();
      } else {
        await showCustomAlert(res.message || '登録情報と一致しませんでした。番号をお確かめください。', '認証エラー', '⚠️');
        btn.disabled = false; btn.textContent = '認証する';
      }
    } catch (e) {
      await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', '⚠️');
      btn.disabled = false; btn.textContent = '認証する';
    }
  }

  // ==========================================
  // クエスト取得・描画
  // ==========================================
  async function fetchBoardQuests(isManualRefresh = false) {
    const listArea = document.getElementById('questListArea');
    const statusBar = document.getElementById('syncStatusBar');
    const btnRef = document.getElementById('btnRefresh');

    if (listArea.children.length === 0) {
      listArea.innerHTML = '<div class="empty-box">⏳ 案件を取得中...</div>';
    }
    if (statusBar) statusBar.textContent = '📡 最新情報を取得中...';
    if (isManualRefresh && btnRef) {
      btnRef.disabled = true; btnRef.textContent = '🔄 更新中...';
    }

    try {
      const url = `${GAS_API_URL}?action=getBoardQuests`;
      const res = await (await fetch(url)).json();

      if (res.success && res.quests) {
        currentQuests = res.quests;
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(res.quests));
        if (res.quests.length > 0) {
          renderQuests(res.quests);
        } else {
          listArea.innerHTML = '<div class="empty-box">現在募集中の運行案件はありません。</div>';
        }
        if (statusBar) statusBar.textContent = '✔ 最新の情報に更新済み';
      }
    } catch (e) {
      if (statusBar) statusBar.textContent = '⚠️ 通信エラー';
    } finally {
      if (btnRef) {
        btnRef.disabled = false; btnRef.textContent = '🔄 最新の案件に更新';
      }
      setTimeout(() => { if (statusBar) statusBar.textContent = ''; }, 3000);
    }
  }

  function createTripBadgeHtml(tripPlan) {
    const text = String(tripPlan || '往復').trim();
    if (text.includes('片道')) {
      return `<div class="trip-plan-badge oneway"><span>➡️</span><span>片道（送り届けのみ）</span></div>`;
    }

    let waitText = '';
    const m = text.match(/(\d+分[〜～\-]\d+時間|\d+分[〜～\-]\d+分|\d+時間[〜～\-]\d+時間|\d+分以内|\d+時間以上|\d+分|\d+時間)/);
    if (m) {
      waitText = m[0];
    } else if (text.includes('30分以内')) {
      waitText = '30分以内';
    } else if (text.includes('30分〜1時間') || text.includes('1時間以内')) {
      waitText = '30分〜1時間';
    } else if (text.includes('1時間〜2時間')) {
      waitText = '1〜2時間';
    } else if (text.includes('2時間以上')) {
      waitText = '2時間以上';
    }

    if (waitText) {
      return `<div class="trip-plan-badge round-medium"><span>🚗</span><span>往復（待機目安: ${waitText}）</span></div>`;
    }
    return `<div class="trip-plan-badge round-medium"><span>🚗</span><span>往復（待機あり）</span></div>`;
  }

  function renderQuests(quests) {
    const listArea = document.getElementById('questListArea');
    listArea.innerHTML = '';

    quests.forEach(q => {
      const card = document.createElement('div');
      card.className = q.isUrgent ? 'quest-card urgent-card' : 'quest-card';

      const urgentBannerHtml = q.isUrgent
        ? '<div class="urgent-banner"><span>🚨</span><span>【至急】運行日が迫っています（直前募集中）</span></div>'
        : '';

      const agencyTag = q.isAgency ? '<span class="agency-tag">ケアマネ等代理</span>' : '';
      let displayDate = q.dateText || '日時指定なし';
      let timeBadgeHtml = '';

      const timeMatch = displayDate.match(/(\d{1,2}:\d{2})/);
      if (timeMatch) {
        const timeVal = timeMatch[1];
        displayDate = displayDate.replace(timeVal, '').trim();
        timeBadgeHtml = `<span class="quest-time-badge">⏰ ${timeVal} 集合</span>`;
      } else if (q.targetTime) {
        timeBadgeHtml = `<span class="quest-time-badge">⏰ ${q.targetTime} 集合</span>`;
      }

      const pickupMapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q.pickup || '');
      const dropoffMapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q.dropoff || '');
      const tripBadgeHtml = createTripBadgeHtml(q.tripPlan);

      let noteBoxHtml = '';
      if (q.note) {
        noteBoxHtml = `
          <div class="note-box">
            <div class="note-box-title"><span>📝</span><span>特記事項・介助要件:</span></div>
            <div class="note-box-body">${escapeHtml(q.note)}</div>
          </div>
        `;
      }

      card.innerHTML = `
        ${urgentBannerHtml}
        <div class="quest-header">
          <span class="quest-id-badge">案件 #${q.id}</span>
          ${agencyTag}
        </div>
        ${tripBadgeHtml}
        <div class="quest-datetime-wrap">
          <span class="quest-date">📅 ${displayDate}</span>
          ${timeBadgeHtml}
        </div>
        <div class="route-container">
          <div class="route-row">
            <span class="route-label">出発地:</span>
            <a href="${pickupMapUrl}" target="_blank" rel="noopener noreferrer" class="route-link">
              <span>${q.pickup}</span> <span>🗺️</span>
            </a>
          </div>
          <div class="route-row">
            <span class="route-label">目的地:</span>
            <a href="${dropoffMapUrl}" target="_blank" rel="noopener noreferrer" class="route-link">
              <span>${q.dropoff}</span> <span>🗺️</span>
            </a>
          </div>
        </div>
        <div class="quest-meta">
          <span>乗車人数: ${q.passengers}</span>
          <span>利用者: ${q.userNameMasked}</span>
        </div>
        ${noteBoxHtml}
        <button type="button" class="btn-accept" onclick="openAcceptModal('${q.id}')">この案件を受託する</button>
      `;
      listArea.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ==========================================
  // 受託モーダル制御
  // ==========================================
  function openAcceptModal(qid) {
    const target = currentQuests.find(item => String(item.id) === String(qid));
    if (!target) return;

    targetAcceptQid = qid;

    const detailsHtml = `
      <div class="modal-row"><span class="modal-label">案件番号:</span><span class="modal-value">#${target.id}</span></div>
      <div class="modal-row"><span class="modal-label">運行区分:</span><span class="modal-value" style="color:var(--primary-blue);">${target.tripPlan || '往復'}</span></div>
      <div class="modal-row"><span class="modal-label">集合日時:</span><span class="modal-value">${target.dateText}</span></div>
      <div class="modal-row"><span class="modal-label">出発地:</span><span class="modal-value">${target.pickup}</span></div>
      <div class="modal-row"><span class="modal-label">目的地:</span><span class="modal-value">${target.dropoff}</span></div>
      <div class="modal-row"><span class="modal-label">利用者:</span><span class="modal-value">${target.userNameMasked} (${target.passengers})</span></div>
    `;
    document.getElementById('modalDetailsArea').innerHTML = detailsHtml;

    const noteArea = document.getElementById('modalNoteArea');
    if (target.note) {
      noteArea.innerHTML = `
        <div class="note-box" style="margin-bottom:16px;">
          <div class="note-box-title"><span>📝</span><span>特記事項・介助要件:</span></div>
          <div class="note-box-body">${escapeHtml(target.note)}</div>
        </div>
      `;
    } else {
      noteArea.innerHTML = `
        <div class="note-box" style="margin-bottom:16px; background:#f8fafc; border-color:#cbd5e1; color:#64748b;">
          <div class="note-box-title"><span>📝</span><span>特記事項:</span></div>
          <div class="note-box-body">特になし</div>
        </div>
      `;
    }

    const confirmBtn = document.getElementById('btnConfirmAccept');
    confirmBtn.disabled = false;
    confirmBtn.textContent = '受託する';

    document.getElementById('acceptModalOverlay').style.display = 'flex';
  }

  function closeAcceptModal() {
    if (isProcessingAccept) return;
    document.getElementById('acceptModalOverlay').style.display = 'none';
    targetAcceptQid = null;
  }

  function handleModalOverlayClick(e) {
    if (e.target.id === 'acceptModalOverlay') {
      closeAcceptModal();
    }
  }

  async function confirmAndExecuteAccept() {
    if (isProcessingAccept || !targetAcceptQid) return;

    isProcessingAccept = true;
    const confirmBtn = document.getElementById('btnConfirmAccept');
    confirmBtn.disabled = true;
    confirmBtn.textContent = '受託処理中...';

    const reqQid = targetAcceptQid;

    try {
      const url = `${GAS_API_URL}?action=acceptQuest&qid=${encodeURIComponent(reqQid)}&driverId=${encodeURIComponent(currentDriver.id)}`;
      const res = await (await fetch(url)).json();

      closeAcceptModal();

      if (res.success) {
        await showCustomAlert(
          `案件 [#${reqQid}] の受託が完了しました！\n\n公式LINEへ集合時間や活動記録のリンクをお送りしましたのでご確認ください。安全運転でお願いいたします。`,
          '受託完了',
          '🎉'
        );
        fetchBoardQuests(true);
      } else {
        await showCustomAlert(`受託できませんでした:\n${res.message || 'すでに受託されたか、募集が締め切られています。'}`, '受託不可', '⚠️');
        fetchBoardQuests(true);
      }
    } catch (e) {
      closeAcceptModal();
      await showCustomAlert('通信エラーが発生しました: ' + e.message, '通信エラー', '⚠️');
    } finally {
      isProcessingAccept = false;
    }
  }

  // ==========================================
  // ★プル・トゥ・リフレッシュ（Pull-to-Refresh）実装
  // ==========================================
  let ptrStartY = 0;
  let ptrCurrentY = 0;
  let isPtrPulling = false;
  let isPtrBusy = false;
  const PTR_LIMIT = 68; // しきい値(px)

  const ptrContainer = document.getElementById('ptrContainer');
  const ptrIcon = document.getElementById('ptrIcon');
  const ptrSpinner = document.getElementById('ptrSpinner');
  const ptrText = document.getElementById('ptrText');

  window.addEventListener('touchstart', (e) => {
    // 画面が一番上にある時のみプルを検知
    if (window.scrollY <= 0 && !isPtrBusy && document.getElementById('boardSection').style.display !== 'none') {
      ptrStartY = e.touches[0].clientY;
      isPtrPulling = true;
    }
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (!isPtrPulling || isPtrBusy) return;
    ptrCurrentY = e.touches[0].clientY;
    const diff = ptrCurrentY - ptrStartY;

    if (diff > 0 && window.scrollY <= 0) {
      const pullDistance = Math.min(diff * 0.45, 95);
      ptrContainer.style.height = pullDistance + 'px';

      if (pullDistance >= PTR_LIMIT) {
        ptrText.textContent = '指を離して更新';
        ptrIcon.style.transform = 'rotate(180deg)';
      } else {
        ptrText.textContent = '引いて最新に更新';
        ptrIcon.style.transform = 'rotate(0deg)';
      }
    } else {
      ptrContainer.style.height = '0px';
    }
  }, { passive: true });

  window.addEventListener('touchend', async () => {
    if (!isPtrPulling || isPtrBusy) return;
    isPtrPulling = false;

    const diff = ptrCurrentY - ptrStartY;
    const pullDistance = diff * 0.45;

    if (pullDistance >= PTR_LIMIT && window.scrollY <= 0) {
      isPtrBusy = true;
      ptrContainer.style.height = '48px';
      ptrIcon.style.display = 'none';
      ptrSpinner.style.display = 'inline-block';
      ptrText.textContent = '最新の案件を取得中...';

      try {
        await fetchBoardQuests(true);
      } finally {
        setTimeout(() => {
          ptrContainer.style.height = '0px';
          setTimeout(() => {
            ptrSpinner.style.display = 'none';
            ptrIcon.style.display = 'inline-block';
            ptrIcon.style.transform = 'rotate(0deg)';
            ptrText.textContent = '引いて最新に更新';
            isPtrBusy = false;
            ptrStartY = 0;
            ptrCurrentY = 0;
          }, 220);
        }, 400);
      }
    } else {
      ptrContainer.style.height = '0px';
      ptrStartY = 0;
      ptrCurrentY = 0;
    }
  });

  // 即時実行ガード
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkSavedDriver);
  } else {
    checkSavedDriver();
  }
</script>
</body>
</html>
