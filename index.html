<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 利用者登録</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      /* Apple HIG System Palette (Light Mode) */
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --border-color: rgba(60, 60, 67, 0.12);
      --success-green: #248A3D;
      --success-bg: rgba(52, 199, 89, 0.1);
      --danger-red: #D70015;
      --danger-bg: rgba(255, 59, 48, 0.08);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-segment: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-variant-numeric: tabular-nums;
      padding-bottom: calc(env(safe-area-inset-bottom) + 48px);
    }

    /* HIG Translucent Navigation Bar */
    header {
      background-color: rgba(255, 255, 255, 0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.18);
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* HIG Inset Grouped Card */
    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 26px 20px;
      margin-bottom: 16px;
      border: 0.5px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }

    .form-group {
      margin-bottom: 24px;
    }

    /* ★見出しラベルのみに限定（ボタン枠に干渉させない） */
    .form-group > label {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding-left: 2px;
      color: var(--text-main);
    }

    .form-group .sub-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 2px;
      line-height: 1.45;
    }

    /* HIG Text Field */
    input[type="text"], input[type="tel"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1.5px solid transparent;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      background-color: var(--surface-secondary);
      transition: all 0.2s var(--ease-spring);
    }

    input[type="text"]::placeholder,
    input[type="tel"]::placeholder {
      color: #AEAEB2;
    }

    input[type="text"]:focus, input[type="tel"]:focus {
      background-color: #FFFFFF;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
      outline: none;
    }

    /* ★上下中央・左右中央を完全固定しつつHIG Segmented Control風に昇華したラジオボタンスタイル */
    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      background-color: rgba(118, 118, 128, 0.12);
      padding: 4px;
      border-radius: 14px;
    }

    .radio-group .radio-label {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      height: 46px !important;
      margin: 0 !important;
      padding: 0 10px !important;
      border: 1.5px solid transparent;
      border-radius: 11px;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-muted);
      cursor: pointer;
      background-color: transparent;
      transition: all 0.22s var(--ease-spring);
      user-select: none;
      white-space: nowrap;
    }

    .radio-group .radio-label input[type="radio"] {
      width: 18px !important;
      height: 18px !important;
      margin: 0 !important;
      padding: 0 !important;
      flex-shrink: 0;
      accent-color: var(--primary-blue);
      cursor: pointer;
    }

    .radio-group .radio-label span {
      display: inline-block;
      line-height: 1;
    }

    .radio-group .radio-label.active {
      background-color: #FFFFFF;
      color: var(--primary-blue);
      font-weight: 700;
      box-shadow: var(--shadow-segment);
    }

    /* HIG Primary Button */
    .btn-submit {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      background-color: var(--primary-blue);
      color: #FFFFFF;
      font-size: 1.08rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: all 0.2s var(--ease-spring);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.01em;
    }

    .btn-submit:active {
      background-color: var(--primary-hover);
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 完了画面 */
    #completeView {
      display: none;
      animation: fadeIn 0.3s var(--ease-spring);
    }

    .complete-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 30px 22px;
      border: 0.5px solid var(--border-color);
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .complete-header {
      color: var(--success-green);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .number-display-card {
      background: rgba(0, 122, 255, 0.06);
      border: 1px solid rgba(0, 122, 255, 0.2);
      border-radius: 18px;
      padding: 24px 16px;
      margin: 22px 0;
      text-align: center;
    }

    .number-display-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .number-display-value {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--primary-blue);
      line-height: 1.1;
    }

    .number-notice {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 12px;
      font-weight: 600;
    }

    .close-instruction-banner {
      background: var(--danger-bg);
      border: 1.5px solid rgba(255, 59, 48, 0.3);
      border-radius: 16px;
      padding: 18px 16px;
      margin: 18px 0 4px 0;
      text-align: center;
      animation: pulse 2.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.25); }
      70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .close-instruction-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--danger-red);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .close-instruction-desc {
      font-size: 0.9rem;
      font-weight: 600;
      color: #7F1D1D;
      line-height: 1.45;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<header>
  <h1>おでかけサポート 利用者登録</h1>
</header>

<div class="container" id="formView">
  <div class="card">
    <div class="form-group">
      <label>申請区分</label>
      <div class="radio-group">
        <label class="radio-label active" id="labelHonin">
          <input type="radio" name="userType" value="本人申請" checked onchange="handleTypeChange()">
          <span>本人申請</span>
        </label>
        <label class="radio-label" id="labelCare">
          <input type="radio" name="userType" value="ケアマネ等代理" onchange="handleTypeChange()">
          <span>ケアマネ等代理</span>
        </label>
      </div>
      <div class="sub-label" style="margin-top:10px;">
        ※ご自身で乗車・申請される方は「本人申請」、ご家族やケアマネジャー等として代理で申請を行いたい方は「ケアマネ等代理」を選択してください。
      </div>
    </div>

    <div class="form-group">
      <label id="nameLabel">利用者氏名</label>
      <div class="sub-label">※漢字またはひらがなで入力してください</div>
      <input type="text" id="userName" placeholder="例: 相模 太郎" autocomplete="name">
    </div>

    <div class="form-group">
      <label>連絡先電話番号</label>
      <div class="sub-label">※日中つながる番号（ハイフン有無どちらでも可）</div>
      <input type="tel" id="userPhone" placeholder="例: 090-1234-5678" inputmode="tel" autocomplete="tel">
    </div>

    <button type="button" class="btn-submit" id="btnSubmit" onclick="submitRegistration()">
      登録する
    </button>
  </div>
</div>

<div class="container" id="completeView">
  <div class="complete-card">
    <div class="complete-header">✔ 登録が完了しました</div>
    <p style="font-size:0.95rem; color:var(--text-muted); font-weight:500;">
      おでかけサポートの利用者登録を受け付けました。
    </p>

    <div class="number-display-card">
      <div class="number-display-label">あなたの利用者登録番号</div>
      <div class="number-display-value" id="dispUserNum">-----</div>
      <div class="number-notice">※今後の送迎お申し込み時にこの番号を使用します</div>
    </div>

    <div class="close-instruction-banner">
      <div class="close-instruction-title">
        <span>👆</span> 画面右上の「 × 」で閉じてください
      </div>
      <div class="close-instruction-desc">
        LINEのトーク画面にも登録番号が届いています。
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
  const LIFF_ID = "2011784961-LZ6p8VqP";

  let lineUserId = '';
  let isSubmitting = false;

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      if (window.liff) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
        }
      }
    } catch (e) {
      console.warn('LIFF初期化スキップ: ' + e.message);
    }
  });

  function handleTypeChange() {
    const isHonin = document.querySelector('input[name="userType"]:checked').value === '本人申請';
    document.getElementById('labelHonin').className = isHonin ? 'radio-label active' : 'radio-label';
    document.getElementById('labelCare').className = !isHonin ? 'radio-label active' : 'radio-label';
  }

  async function submitRegistration() {
    if (isSubmitting) return;

    const name = document.getElementById('userName').value.trim();
    const phone = document.getElementById('userPhone').value.trim();
    const userType = document.querySelector('input[name="userType"]:checked').value;

    if (!name) {
      alert('お名前を入力してください。');
      return;
    }
    if (!phone) {
      alert('電話番号を入力してください。');
      return;
    }

    const btn = document.getElementById('btnSubmit');
    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = '登録処理中...';

    const payload = {
      name: name,
      phone: phone,
      userType: userType,
      lineUserId: lineUserId
    };

    try {
      const url = `${GAS_API_URL}?action=registerUser&data=${encodeURIComponent(JSON.stringify(payload))}`;
      const res = await (await fetch(url)).json();

      if (res.success) {
        const finalNumber = res.userNum || res.userNumber || res.userId || res.id || res.regNumber || (res.data && res.data.userNum) || '取得済';

        document.getElementById('formView').style.display = 'none';
        document.getElementById('completeView').style.display = 'block';
        document.getElementById('dispUserNum').textContent = finalNumber;

        window.scrollTo(0, 0);
      } else {
        alert('登録エラー: ' + res.message);
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = '登録する';
      }
    } catch (e) {
      alert('通信エラー: ' + e.message);
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = '登録する';
    }
  }
</script>
</body>
</html>
