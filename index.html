<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おでかけサポート 利用者登録</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary-blue: #007AFF;
      --primary-hover: #0056B3;
      --bg-base: #F2F2F7;
      --card-bg: #FFFFFF;
      --surface-secondary: #F2F2F7;
      --text-main: #1C1C1E;
      --text-muted: #6C6C70;
      --danger-red: #DC2626;
      --warning-amber: #D97706;
      --success-green: #15803D;
      --border-color: rgba(60, 60, 67, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 40px;
      line-height: 1.5;
    }
    .lucide {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.18em;
      stroke-width: 2.2;
      display: inline-block;
      flex-shrink: 0;
    }
    button {
      white-space: nowrap !important;
    }
    header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5EA;
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 0.5px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .form-group .sub-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      height: 46px;
      border: 1.5px solid #E5E5EA;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 1rem;
      color: var(--text-main);
      background: #FAFAFA;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary-blue);
      background: #FFFFFF;
    }
    .radio-group {
      display: flex;
      gap: 10px;
    }
    .radio-label {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      border: 1.5px solid #E5E5EA;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      background: #FAFAFA;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .radio-label.active {
      border-color: var(--primary-blue);
      background: #EFF6FF;
      color: var(--primary-blue);
    }
    .radio-group input[type="radio"] {
      display: none;
    }
    .btn-submit {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      background: var(--primary-blue);
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.7;
    }
    .btn-submit:not(:disabled):active {
      background: var(--primary-hover);
    }

    /* 登録完了ビュー */
    .complete-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 26px 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 0.5px solid var(--border-color);
    }
    .complete-header {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--success-green);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .number-display-card {
      margin: 20px 0;
      padding: 18px;
      background: #F0FDF4;
      border: 1.5px solid #BBF7D0;
      border-radius: 14px;
    }
    .number-display-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #166534;
    }
    .number-display-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.4rem;
      font-weight: 900;
      color: #15803D;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }
    .number-display-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
    }
    .close-instruction-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 12px;
      margin: 16px 0;
    }
    .close-instruction-title {
      font-weight: 800;
      color: #991B1B;
      font-size: 0.95rem;
    }
    .close-instruction-desc {
      font-size: 0.82rem;
      color: #7F1D1D;
      margin-top: 4px;
    }

    /* サイト名非表示カスタムダイアログ（iOS風） */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 0.5px solid var(--border-color);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .modal-message {
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.5;
      white-space: pre-wrap;
      text-align: left;
      background: var(--surface-secondary);
      padding: 12px;
      border-radius: 12px;
      margin: 12px 0 16px 0;
    }
    .btn-modal-confirm {
      width: 100%;
      height: 44px;
      background: var(--primary-blue);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #FFFFFF;
      cursor: pointer;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.9s linear infinite;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <i data-lucide="user-plus"></i>
      <span>おでかけサポート 利用者登録</span>
    </h1>
  </header>

  <div class="container" id="formView">
    <div class="card">
      <!-- 申請区分 -->
      <div class="form-group">
        <label>
          <i data-lucide="badge-help"></i>
          <span>申請区分</span>
        </label>
        <div class="radio-group">
          <label class="radio-label active" id="labelHonin">
            <input type="radio" name="userType" value="本人申請" checked onchange="handleUserTypeChange()">
            <i data-lucide="user"></i>
            <span>本人申請</span>
          </label>
          <label class="radio-label" id="labelCare">
            <input type="radio" name="userType" value="ケアマネ等代理" onchange="handleUserTypeChange()">
            <i data-lucide="heart-handshake"></i>
            <span>ケアマネ等代理</span>
          </label>
        </div>
        <div class="sub-label">
          ※ご自身で利用される方は「本人申請」、ご家族やケアマネジャー等として代理で申請される方は「ケアマネ等代理」を選択してください。
        </div>
      </div>

      <!-- 利用者氏名 -->
      <div class="form-group">
        <label>
          <i data-lucide="user-check"></i>
          <span>利用者氏名</span>
        </label>
        <input type="text" id="userName" placeholder="例: 相模 太郎">
        <div class="sub-label">※漢字またはひらがなでお名前を入力してください</div>
      </div>

      <!-- 連絡先電話番号 -->
      <div class="form-group">
        <label>
          <i data-lucide="phone"></i>
          <span>連絡先電話番号</span>
        </label>
        <input type="tel" id="userPhone" placeholder="例: 090-1234-5678" inputmode="numeric">
        <div class="sub-label">※日中つながる電話番号を入力してください（ハイフン有無どちらでも可）</div>
      </div>

      <button type="button" class="btn-submit" id="btnSubmit" onclick="submitRegistration()">
        <i data-lucide="send"></i>
        <span>登録する</span>
      </button>
    </div>
  </div>

  <!-- 登録完了ビュー -->
  <div class="container" id="completeView" style="display:none;">
    <div class="complete-card">
      <div class="complete-header">
        <i data-lucide="check-circle-2"></i>
        <span>登録が完了しました</span>
      </div>
      <p style="font-size:0.9rem; color:var(--text-muted); font-weight:500;">
        おでかけサポートの利用者登録を受け付けました。
      </p>

      <div class="number-display-card">
        <div class="number-display-label">あなたの利用者登録番号</div>
        <div class="number-display-value" id="dispUserNum">-----</div>
        <div class="number-display-name" id="dispUserName">相模 太郎 様</div>
      </div>

      <div class="close-instruction-banner">
        <div class="close-instruction-title">
          画面右上の「 × 」で閉じてください
        </div>
        <div class="close-instruction-desc">
          LINEのトーク画面にも登録番号が届いています。<br>今後の送迎お申込み時にこの番号を使用します。
        </div>
      </div>
    </div>
  </div>

  <!-- サイト名非表示カスタムダイアログ（iOS風） -->
  <div id="customDialogOverlay" class="modal-overlay" style="display:none;" onclick="handleDialogOverlayClick(event)">
    <div class="modal-card">
      <div id="customDialogIconArea" style="display:flex; justify-content:center; margin-bottom:8px;"></div>
      <h3 id="customDialogTitle" class="modal-title">通知</h3>
      <div id="customDialogMessage" class="modal-message"></div>
      <button type="button" class="btn-modal-confirm" id="btnDialogOk" onclick="closeCustomDialog()">閉じる</button>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    const USER_REG_LIFF_ID = "2011784961-0qNrk1l4";

    let lineUserId = '';
    let isSubmitting = false;

    function refreshLucide() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // ★カスタムダイアログ制御（サイト名強制表示の排除）
    let customDialogResolve = null;
    function showCustomAlert(message, title = 'お知らせ', iconName = 'alert-circle', iconColor = 'var(--danger-red)') {
      return new Promise((resolve) => {
        document.getElementById('customDialogIconArea').innerHTML = `<i data-lucide="${iconName}" style="width:42px; height:42px; color:${iconColor};"></i>`;
        document.getElementById('customDialogTitle').textContent = title;
        document.getElementById('customDialogMessage').textContent = message;
        customDialogResolve = resolve;
        document.getElementById('customDialogOverlay').style.display = 'flex';
        refreshLucide();
      });
    }

    function closeCustomDialog() {
      document.getElementById('customDialogOverlay').style.display = 'none';
      if (customDialogResolve) {
        const cb = customDialogResolve;
        customDialogResolve = null;
        cb();
      }
    }

    function handleDialogOverlayClick(e) {
      if (e.target.id === 'customDialogOverlay') closeCustomDialog();
    }

    function handleUserTypeChange() {
      const isHonin = document.querySelector('input[name="userType"]:checked').value === '本人申請';
      document.getElementById('labelHonin').className = isHonin ? 'radio-label active' : 'radio-label';
      document.getElementById('labelCare').className = !isHonin ? 'radio-label active' : 'radio-label';
    }

    async function submitRegistration() {
      if (isSubmitting) return;

      const name = document.getElementById('userName').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const userType = document.querySelector('input[name="userType"]:checked').value;

      if (!name || !phone) {
        await showCustomAlert('お名前と電話番号を入力してください。', '入力確認', 'alert-circle', 'var(--warning-amber)');
        return;
      }

      isSubmitting = true;
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i><span>登録中...</span>';
      refreshLucide();

      const payload = {
        action: 'registerUser',
        name: name,
        phone: phone,
        userType: userType,
        lineUserId: lineUserId
      };

      try {
        const res = await fetch(`${GAS_API_URL}?action=registerUser`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          const userNum = data.userNum || data.userNumber || '-----';
          document.getElementById('dispUserNum').textContent = userNum;
          document.getElementById('dispUserName').textContent = `${data.name || name} 様`;
          document.getElementById('formView').style.display = 'none';
          document.getElementById('completeView').style.display = 'block';
          refreshLucide();
        } else {
          await showCustomAlert(data.message || '登録に失敗しました。もう一度お試しください。', '登録エラー', 'alert-circle', 'var(--danger-red)');
        }
      } catch (err) {
        await showCustomAlert('通信エラーが発生しました: ' + err.message, '通信エラー', 'alert-triangle', 'var(--danger-red)');
      } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send"></i><span>登録する</span>';
        refreshLucide();
      }
    }

    // LIFF初期化
    async function initLiff() {
      try {
        if (window.liff && USER_REG_LIFF_ID) {
          await liff.init({ liffId: USER_REG_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            if (profile && profile.userId) {
              lineUserId = profile.userId;
            }
          }
        }
      } catch (e) {
        console.warn('LIFF初期化スキップ:', e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshLucide();
      initLiff();
    });
  </script>
</body>
</html>
