<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>利用者登録 | おでかけサポート</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      -webkit-tap-highlight-color: transparent;
    }
    .lucide { stroke-width: 2.2; }
    *, ::before, ::after { box-sizing: border-box !important; }
    input, select, textarea { box-sizing: border-box !important; max-width: 100% !important; }
    button, select, a { white-space: nowrap !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased pb-24 text-base">

  <!-- ローディングオーバーレイ -->
  <div id="blockingOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs hidden">
    <div class="w-full max-w-xs rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center">
      <i data-lucide="loader-2" class="h-10 w-10 animate-spin text-blue-600 mx-auto"></i>
      <div class="mt-3 text-base font-bold text-slate-900">登録処理中</div>
      <div class="mt-1 text-xs text-slate-500">LINEへ登録完了メッセージを送信中...</div>
    </div>
  </div>

  <!-- スティッキーヘッダー -->
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-xl items-center justify-between px-4 py-3.5 sm:px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-white shadow-xs">
          <i data-lucide="user-plus" class="h-5 w-5"></i>
        </div>
        <h1 class="text-lg font-black tracking-tight text-slate-900">利用者登録</h1>
      </div>
      <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600 border border-slate-200">
        おでかけサポート
      </span>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-4 pt-4 sm:px-6 space-y-4">

    <!-- LINE連携状態カード -->
    <div id="lineStatusCard" class="rounded-xl border border-slate-200 bg-white p-3.5 shadow-2xs flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div id="lineStatusDot" class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-pulse"></div>
        <span id="lineStatusText" class="text-xs font-bold text-slate-700">LINEアカウント確認中...</span>
      </div>
      <button
        type="button"
        id="btnLineLogin"
        class="hidden rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-bold text-white shadow-xs hover:bg-emerald-700 active:scale-95"
        onclick="triggerLineLogin()"
      >
        LINEでログイン
      </button>
    </div>

    <form id="userRegisterForm" class="space-y-5" onsubmit="event.preventDefault(); executeUserRegister();">

      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h2 class="text-base font-bold text-slate-900">利用者情報入力</h2>
          <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100">必須</span>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-800 mb-1.5">お名前</label>
          <input
            type="text"
            id="userName"
            placeholder="例: 相模 花子"
            required
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-white px-4 text-base font-bold text-slate-900 outline-none transition focus:border-blue-600"
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-800 mb-1.5">お電話番号</label>
          <input
            type="tel"
            id="userPhone"
            placeholder="例: 090-1234-5678"
            required
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-white px-4 font-mono text-base font-bold text-slate-900 outline-none transition focus:border-blue-600"
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-800 mb-1.5">ご住所</label>
          <input
            type="text"
            id="userAddress"
            placeholder="例: 相模原市緑区中野1-2-3"
            required
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-white px-4 text-base font-medium text-slate-900 outline-none transition focus:border-blue-600"
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-800 mb-1.5">申請区分</label>
          <select
            id="userType"
            class="w-full h-12 rounded-xl border-2 border-slate-200 bg-white px-4 text-base font-bold text-slate-900 outline-none transition focus:border-blue-600"
          >
            <option value="本人申請">本人申請</option>
            <option value="ケアマネ等代理">ケアマネ等代理</option>
          </select>
        </div>
      </section>

      <div class="pt-2">
        <button
          type="submit"
          class="inline-flex w-full h-14 items-center justify-center gap-2 rounded-2xl bg-blue-600 text-lg font-black text-white shadow-md hover:bg-blue-700 active:scale-98 transition"
        >
          <i data-lucide="check" class="h-5 w-5"></i>
          <span>登録する</span>
        </button>
      </div>

    </form>
  </main>

  <!-- 完了モーダル -->
  <div id="completeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-xs hidden">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl text-center">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-emerald-600 mb-3">
        <i data-lucide="badge-check" class="h-8 w-8"></i>
      </div>
      <h3 class="text-xl font-black text-slate-900">利用者登録が完了しました</h3>
      
      <div class="my-4 rounded-xl border border-emerald-200 bg-emerald-50/70 p-4 text-left text-xs space-y-2 text-emerald-900 leading-relaxed">
        <div class="font-bold text-sm text-emerald-800 flex items-center gap-1">
          <i data-lucide="message-circle" class="h-4 w-4"></i>
          <span>LINEへ登録番号をお送りしました</span>
        </div>
        <p>公式LINEのトーク画面をご確認ください。今後の送迎依頼には発行された登録番号を使用します。</p>
        <div class="mt-2 text-sm font-bold text-slate-900 bg-white p-2.5 rounded-lg border border-emerald-200 text-center">
          登録番号: <span id="dispUserNum" class="font-mono text-blue-600 text-base">----</span>
        </div>
      </div>

      <div class="mt-5">
        <button type="button" class="w-full rounded-xl bg-slate-900 py-3 text-sm font-bold text-white hover:bg-slate-800 transition" onclick="handleCloseWindow()">
          画面を閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrw8HzRBcMOQsHLp5mkKXisYkDl2IocZVF1glMmAGPkwsXSnOcNv6-jGWg9gBxl6jH/exec";
    // 利用者登録用LIFF ID
    const USER_REG_LIFF_ID = "2011784961-LZ6p8VqP";

    let lineUserId = '';

    function refreshLucide() {
      if (window.lucide) lucide.createIcons();
    }

    function triggerLineLogin() {
      if (window.liff && !liff.isLoggedIn()) {
        liff.login();
      }
    }

    function updateLineStatus(isSuccess, name = '', uid = '') {
      const dot = document.getElementById("lineStatusDot");
      const text = document.getElementById("lineStatusText");
      const btn = document.getElementById("btnLineLogin");

      if (isSuccess) {
        dot.className = "h-2.5 w-2.5 rounded-full bg-emerald-500";
        text.className = "text-xs font-bold text-emerald-800";
        text.innerHTML = `<span class="text-slate-500 font-normal">LINE連携:</span> ${name} 様`;
        btn.classList.add("hidden");
      } else {
        dot.className = "h-2.5 w-2.5 rounded-full bg-red-500";
        text.className = "text-xs font-bold text-red-700";
        text.textContent = "LINE未連携（登録番号通知を受け取るにはログインが必要です）";
        btn.classList.remove("hidden");
      }
    }

    async function executeUserRegister() {
      const overlay = document.getElementById("blockingOverlay");
      overlay.classList.remove("hidden");
      refreshLucide();

      const payload = {
        action: "registerUser",
        name: document.getElementById("userName").value.trim(),
        phone: document.getElementById("userPhone").value.trim(),
        address: document.getElementById("userAddress").value.trim(),
        userType: document.getElementById("userType").value,
        lineUserId: lineUserId // 取得したLINE IDを送信
      };

      try {
        const res = await fetch(`${GAS_API_URL}?action=registerUser`, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("dispUserNum").textContent = data.userNum || '----';
          document.getElementById("completeModal").classList.remove("hidden");
          refreshLucide();
        } else {
          alert("登録エラー: " + (data.message || "エラー"));
        }
      } catch (e) {
        alert("通信エラー: " + e.message);
      } finally {
        overlay.classList.add("hidden");
      }
    }

    function handleCloseWindow() {
      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      refreshLucide();

      try {
        if (window.liff) {
          await liff.init({ liffId: USER_REG_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            lineUserId = profile.userId || '';
            updateLineStatus(true, profile.displayName || '', lineUserId);
          } else {
            if (liff.isInClient()) {
              liff.login();
            } else {
              updateLineStatus(false);
            }
          }
        } else {
          updateLineStatus(false);
        }
      } catch (e) {
        console.warn("LIFF初期化エラー:", e);
        updateLineStatus(false);
      }
    });
  </script>
</body>
</html>
